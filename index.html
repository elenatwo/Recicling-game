 * interactuar), animaciones, recursos, experiencia, inventario y equipo.
 * ===================================================================== */
'use strict';
(function () {
  const U = G.U;
  const EQUIP_SLOTS = ['head', 'amulet', 'weapon', 'chest', 'offhand', 'hands', 'ring1', 'belt', 'ring2', 'feet'];

  class Player extends G.Unit {
    constructor() {
      super({ team: 'player', r: 0.32, height: 64 });
      this.isPlayer = true;
      const P = G.Data.progression;
      this.level = 1; this.xp = 0;
      this.attrs = Object.assign({}, P.baseAttributes);
      this.attrPoints = 0;
      this.skillPoints = P.startSkillPoints - Object.keys(P.startSkills).length;
      this.skills = Object.assign({}, P.startSkills);
      this.equip = {}; EQUIP_SLOTS.forEach((s) => (this.equip[s] = null));
      this.inv = new G.Items.Grid(10, 4);
      this.stash = new G.Items.Grid(10, 8);
      this.beltSlots = [null, null, null, null];
      this.gold = 50;
      this.buffs = {};
      this.cooldowns = {};
      this.hot = []; // curaciones en el tiempo
      this.leftSkill = 'attack';
      this.rightSkill = 'golpe_llave';
      this.hotkeys = { KeyQ: 'golpe_llave', KeyW: null, KeyE: null, KeyR: null, KeyD: null, KeyF: null };
      this.order = null; this.action = null; this.path = null; this.pathT = 0;
      this.whirl = null;
      this.blockAnim = 0;
      this.stats = null;
      this.mana = 0;
      this.weaponSub = null; this.ranged = false;
    }

    // ---------------- estadísticas ----------------
    recalc() {
      const s = G.Stats.compute(this);
      const lifePct = this.maxLife ? this.life / this.maxLife : 1;
      const manaPct = this.maxMana ? this.mana / this.maxMana : 1;
      this.maxLife = s.maxLife; this.maxMana = s.maxMana;
      if (this._init) { this.life = Math.min(this.maxLife, Math.max(1, lifePct * this.maxLife)); this.mana = Math.min(this.maxMana, manaPct * this.maxMana); }
      else { this.life = this.maxLife; this.mana = this.maxMana; this._init = true; }
      this.weaponSub = s.weapon ? s.weapon.sub : null;
      this.ranged = s.ranged;
      G.UI && G.UI.dirty();
    }
    get ar() { return this.stats.ar; }
    get def() { return this.stats.def; }

    // ---------------- experiencia ----------------
    gainXP(n) {
      const P = G.Data.progression;
      if (this.level >= P.maxLevel) return;
      this.xp += Math.round(n);
      G.game.stats.xp += Math.round(n);
      while (this.level < P.maxLevel && this.xp >= P.xpToNext[this.level]) {
        this.xp -= P.xpToNext[this.level];
        this.level++;
        this.attrPoints += P.attrPointsPerLevel;
        this.skillPoints += P.skillPointsPerLevel;
        this.recalc();
        this.life = this.maxLife; this.mana = this.maxMana;
        G.Audio.play('levelup');
        G.FX.ring(this.x, this.y, 0.2, 3, '#ffe14a', 0.8, 4);
        G.FX.burst(this.x, this.y, 30, 30, { type: 'spark', speed: 3, vz: 220, grav: 200, life: 1, color: ['#ffe14a', '#fff', '#ff9d2a'], glow: true });
        G.UI.banner('¡Nivel ' + this.level + '!', 'Tienes puntos de atributo y de habilidad para gastar');
        if (this.level >= P.maxLevel) this.xp = 0;
      }
      G.UI.dirty();
    }
    xpNeeded() { return G.Data.progression.xpToNext[this.level] || 1; }

    // ---------------- órdenes ----------------
    moveTo(wx, wy) {
      if (this.whirl) { this.whirlTarget = { x: wx, y: wy }; return; }
      this.order = { type: 'move', x: wx, y: wy };
      this.computePath(wx, wy);
    }
    computePath(wx, wy) {
      const map = G.game.map;
      if (G.PF.los(map, this.x, this.y, wx, wy, this.r * 0.85)) { this.path = [[wx, wy]]; return; }
      const p = G.PF.find(map, this.x, this.y, wx, wy, 6000);
      this.path = p ? G.PF.smooth(map, this.x, this.y, p, this.r * 0.85) : null;
      if (this.path && map.walkable(Math.floor(wx), Math.floor(wy))) this.path[this.path.length - 1] = [wx, wy];
    }
    attack(target, skillId) { this.order = { type: 'attack', target, skill: skillId || this.leftSkill }; this.path = null; this.pathT = 0; }
    cast(skillId, wx, wy, target) { this.order = { type: 'cast', skill: skillId, x: wx, y: wy, target }; this.path = null; this.pathT = 0; }
    interact(obj) { this.order = { type: 'interact', obj }; this.computePath(obj.x, obj.y); }
    stop() { this.order = null; this.path = null; }

    // ---------------- bucle ----------------
    update(dt) {
      if (!this.alive) return;
      const s = this.stats;
      this.updateStatuses(dt);
      if (!this.alive) return;
      // regeneración
      this.life = Math.min(this.maxLife, this.life + s.lifeRegen * dt);
      this.mana = Math.min(this.maxMana, this.mana + s.manaRegen * dt);
      for (let i = this.hot.length - 1; i >= 0; i--) {
        const h = this.hot[i]; const k = Math.min(dt, h.t); h.t -= dt;
        if (h.life) this.life = Math.min(this.maxLife, this.life + h.life * k);
        if (h.mana) this.mana = Math.min(this.maxMana, this.mana + h.mana * k);
        if (h.t <= 0) this.hot.splice(i, 1);
      }
      // buffs
      let rec = false;
      for (const id in this.buffs) { this.buffs[id].t -= dt; if (this.buffs[id].t <= 0) { delete this.buffs[id]; rec = true; } }
      if (rec) this.recalc();
      for (const id in this.cooldowns) { this.cooldowns[id] -= dt; if (this.cooldowns[id] <= 0) delete this.cooldowns[id]; }
      this.flash = Math.max(0, this.flash - dt);
      this.blockAnim = Math.max(0, this.blockAnim - dt);
      const map = G.game.map;
      this.applyKnock(dt, map);
      // cinta transportadora
      const sp = map.special[map.idx(Math.floor(this.x), Math.floor(this.y))];
      if (sp >= 1 && sp <= 4) { const d = [[1, 0], [-1, 0], [0, 1], [0, -1]][sp - 1]; map.move(this, d[0] * 1.6 * dt, d[1] * 1.6 * dt); }

      if (this.stunned) { this.moving = false; this.atkAnim = 0; this.action = null; return; }

      // remolino de sierra
      if (this.whirl) { G.Skills.updateWhirl(this, dt); this.moving = true; this.walkT += dt; return; }

      if (this.action) {
        const a = this.action;
        a.t += dt;
        this.atkAnim = Math.min(1, a.t / a.dur);
        if (!a.fired && a.t >= a.hitAt) { a.fired = true; G.Skills.fire(this, a); }
        if (a.t >= a.dur) { this.action = null; this.atkAnim = 0; }
        this.moving = false;
        return;
      }
      this.atkAnim = 0;
      const o = this.order;
      this.moving = false;
      if (!o) return;
      if (o.type === 'attack' || o.type === 'cast') {
        const skill = o.skill === 'attack' ? null : G.Data.skills[o.skill];
        const tgt = o.target;
        if (tgt && (!tgt.alive || tgt.burrowed)) { this.order = null; return; }
        let range, tx, ty;
        if (tgt) { tx = tgt.x; ty = tgt.y; } else { tx = o.x; ty = o.y; }
        if (!skill) range = (s.ranged ? s.weaponRange : s.weaponRange) + (tgt ? tgt.r : 0);
        else if (skill.type === 'melee' || skill.type === 'meleeArc') range = (s.ranged ? 1.5 : s.weaponRange) + (tgt ? tgt.r : 0) + 0.2;
        else if (skill.range) range = skill.range;
        else range = 999;
        const needsMove = (!skill || skill.type === 'melee' || (skill.type === 'meleeArc' && tgt) || skill.type === 'single' || skill.type === 'projectile' || skill.type === 'chain') && tgt;
        const d = U.dist(this.x, this.y, tx, ty);
        const losOK = !s.ranged && !skill ? true : G.PF.los(map, this.x, this.y, tx, ty);
        if (needsMove && (d > range || !losOK) && !G.Input.shift) {
          this.followTo(tx, ty, dt);
          return;
        }
        // comenzar acción
        if (!G.Skills.begin(this, o.skill, tgt, tx, ty)) { this.order = o.repeat ? o : null; if (!o.repeat) return; }
        if (!o.repeat) this.order = null;
        return;
      }
      if (o.type === 'interact') {
        const obj = o.obj;
        if (obj.dead) { this.order = null; return; }
        if (U.dist(this.x, this.y, obj.x, obj.y) <= (obj.useRange || 1.4)) { this.order = null; this.path = null; obj.interact(this); return; }
        this.followPath(dt);
        if (!this.path) this.followTo(obj.x, obj.y, dt);
        return;
      }
      if (o.type === 'move') {
        this.followPath(dt);
        if (!this.path) this.order = null;
      }
    }

    followTo(tx, ty, dt) {
      this.pathT -= dt;
      if (this.pathT <= 0 || !this.path) { this.pathT = 0.35; this.computePath(tx, ty); }
      this.followPath(dt);
    }
    followPath(dt) {
      if (!this.path || !this.path.length) { this.path = null; return; }
      const [px, py] = this.path[0];
      let dx = px - this.x, dy = py - this.y;
      const d = Math.hypot(dx, dy);
      let spd = this.stats.moveSpeed * this.slowMult;
      if (d < 0.08) { this.path.shift(); if (!this.path.length) this.path = null; return; }
      dx /= d; dy /= d;
      if (this.statuses.confuse) { const a = Math.atan2(dy, dx) + Math.sin(G.game.time * 3) * 1.1; dx = Math.cos(a); dy = Math.sin(a); }
      const step = Math.min(d, spd * dt);
      const moved = G.game.map.move(this, dx * step, dy * step);
      this.faceTo(this.x + dx, this.y + dy);
      this.moving = true;
      this.walkT += dt * (spd / 4.3);
      if (!moved) { this.stuckT = (this.stuckT || 0) + dt; if (this.stuckT > 0.25) { this.path.shift(); this.stuckT = 0; if (!this.path.length) this.path = null; } }
      else this.stuckT = 0;
    }
    faceTo(wx, wy) {
      const sx = (wx - this.x) - (wy - this.y);
      if (Math.abs(sx) > 0.01) this.face = sx > 0 ? 1 : -1;
    }

    // ---------------- daño y muerte ----------------
    onDamaged(v, pkt) {
      if (!pkt.isDot) {
        G.Camera.addShake(Math.min(6, 2 + v / this.maxLife * 30));
        if (Math.random() < 0.1) this.wearArmor();
      }
    }
    wearArmor() {
      const slots = ['head', 'chest', 'hands', 'feet', 'belt', 'offhand'].filter((k) => this.equip[k] && this.equip[k].maxDur);
      if (!slots.length) return;
      const it = this.equip[U.pick(slots)];
      it.dur = Math.max(0, it.dur - 1);
      if (it.dur === 0) { G.UI.toast(it.name + ' se ha roto', '#ff5a4a'); this.recalc(); }
    }
    wearWeapon() {
      const w = this.equip.weapon;
      if (w && w.maxDur && Math.random() < 0.12) { w.dur = Math.max(0, w.dur - 1); if (w.dur === 0) { G.UI.toast(w.name + ' se ha roto', '#ff5a4a'); this.recalc(); } }
    }
    die() {
      if (!this.alive) return;
      this.alive = false; this.life = 0;
      this.action = null; this.order = null; this.whirl = null;
      G.Audio.play('death');
      G.FX.debris(this.x, this.y, 30, 16, ['#b5652a', '#7a7e86', '#3fe0ff']);
      G.game.onPlayerDeath();
    }

    // ---------------- consumibles ----------------
    usePotion(it) {
      const c = G.Data.consumables[it.cid];
      if (!c) return false;
      if (c.type === 'potion') {
        if (c.effect === 'life') this.hot.push({ life: c.amount / c.time, t: c.time });
        else if (c.effect === 'mana') this.hot.push({ mana: c.amount / c.time, t: c.time });
        else if (c.effect === 'both') { this.life = Math.min(this.maxLife, this.life + this.maxLife * c.pct); this.mana = Math.min(this.maxMana, this.mana + this.maxMana * c.pct); }
        G.Audio.play('potion');
        G.FX.burst(this.x, this.y, 30, 10, { type: 'bubble', speed: 1, vz: 60, grav: -20, life: 0.8, color: c.effect === 'mana' ? '#3fe0ff' : c.effect === 'life' ? '#ff5a4a' : '#ff4fd8', size: 3 });
        return true;
      }
      if (c.type === 'scroll') return G.game.useTownBeacon();
      return false;
    }
    useBelt(i) {
      const it = this.beltSlots[i];
      if (!it) return;
      if (this.usePotion(it)) {
        it.qty--;
        if (it.qty <= 0) {
          this.beltSlots[i] = null;
          // rellenar desde el inventario
          const e = this.inv.items.find((x) => x.item.cid === it.cid);
          if (e) { this.inv.remove(e.item); this.beltSlots[i] = e.item; }
        }
        G.UI.dirty();
      }
    }

    // ¿cabe el objeto? (recogida)
    pickup(it) {
      if (it.kind === 'potion' || it.kind === 'scroll') {
        // al cinturón primero si coincide
        for (let i = 0; i < 4; i++) {
          const b = this.beltSlots[i];
          if (b && b.cid === it.cid && b.qty < b.stack) { const n = Math.min(it.qty, b.stack - b.qty); b.qty += n; it.qty -= n; if (it.qty <= 0) return true; }
        }
        if (it.kind === 'potion') for (let i = 0; i < 4; i++) if (!this.beltSlots[i]) { this.beltSlots[i] = it; return true; }
      }
      return this.inv.add(it);
    }

    // ---------------- guardado ----------------
    serialize() {
      return {
        level: this.level, xp: this.xp, attrs: this.attrs, attrPoints: this.attrPoints, skillPoints: this.skillPoints,
        skills: this.skills, equip: this.equip, inv: this.inv.serialize(), stash: this.stash.serialize(), belt: this.beltSlots,
        gold: this.gold, leftSkill: this.leftSkill, rightSkill: this.rightSkill, hotkeys: this.hotkeys,
      };
    }
    load(d) {
      Object.assign(this, { level: d.level, xp: d.xp, attrs: d.attrs, attrPoints: d.attrPoints, skillPoints: d.skillPoints, skills: d.skills, gold: d.gold, leftSkill: d.leftSkill || 'attack', rightSkill: d.rightSkill, hotkeys: d.hotkeys || this.hotkeys });
      this.equip = Object.assign({}, this.equip, d.equip);
      this.inv = G.Items.Grid.load(10, 4, d.inv);
      this.stash = G.Items.Grid.load(10, 8, d.stash);
      this.beltSlots = d.belt || [null, null, null, null];
      // reasignar uids
      const fix = (it) => { if (it) it.uid = U.uid(); };
      Object.values(this.equip).forEach(fix); this.inv.items.forEach((e) => fix(e.item)); this.stash.items.forEach((e) => fix(e.item)); this.beltSlots.forEach(fix);
    }

    draw(c, sx, sy, t) {
      if (!this.alive) return;
      this.drawShadow(c, sx, sy);
      // aura de filtro / sobrecarga / armadura
      if (this.buffs.aura_filtro) { c.strokeStyle = U.alpha('#9dff3a', 0.35 + Math.sin(t * 4) * 0.1); c.lineWidth = 2; c.beginPath(); c.ellipse(sx, sy, 34, 16, 0, 0, 7); c.stroke(); }
      if (this.buffs.sobrecarga && Math.random() < 0.3) G.FX.elec(this.x, this.y, U.rand(10, 50), 1);
      if (this.flash > 0 && c.filter !== undefined) c.filter = 'brightness(2.2)';
      c.save(); c.translate(sx, sy);
      this.ranged = this.stats.ranged;
      G.Art.player(c, this, t);
      if (this.buffs.armadura_chapa) { c.strokeStyle = 'rgba(200,210,220,0.5)'; c.lineWidth = 1.5; c.beginPath(); c.arc(0, -36, 22, -2.6, -0.5); c.stroke(); }
      if (this.blockAnim > 0) { c.strokeStyle = U.alpha('#cfd6dc', this.blockAnim * 3); c.lineWidth = 3; c.beginPath(); c.arc(10 * this.face, -34, 16, -1, 1); c.stroke(); }
      c.restore();
      if (c.filter !== undefined) c.filter = 'none';
      if (this.whirl) { c.strokeStyle = 'rgba(255,200,120,0.6)'; c.lineWidth = 3; c.beginPath(); c.ellipse(sx, sy - 20, 60, 28, 0, t * 20, t * 20 + 4); c.stroke(); }
      this.statusTint(c, sx, sy);
    }
  }
  Player.EQUIP_SLOTS = EQUIP_SLOTS;
  G.Player = Player;

  // ---------------------------------------------------------------
  // Dron Chatarrero (aliado)
  // ---------------------------------------------------------------
  class Drone extends G.Unit {
    constructor(p, life, dmg, dur) {
      super({ team: 'player', x: p.x + U.rand(-1, 1), y: p.y + U.rand(-1, 1), r: 0.25, life, height: 40 });
      this.owner = p; this.dmg = dmg; this.t = dur; this.cd = 0.5; this.level = p.level;
      this.res = { elec: 50, tox: 50, fire: 0, mag: 0 }; this.armor = 10; this.defense = 20;
      this.orbit = Math.random() * 6.28;
      this.isAlly = true;
    }
    update(dt) {
      this.t -= dt; if (this.t <= 0 || this.life <= 0) { this.die(); return; }
      this.updateStatuses(dt);
      this.flash = Math.max(0, this.flash - dt);
      this.orbit += dt * 1.2;
      const p = this.owner;
      const tx = p.x + Math.cos(this.orbit) * 1.6, ty = p.y + Math.sin(this.orbit) * 1.6;
      const d = U.dist(this.x, this.y, tx, ty);
      if (d > 0.1) { const sp = Math.min(d, (d > 6 ? 12 : 5) * dt); this.x += (tx - this.x) / d * sp; this.y += (ty - this.y) / d * sp; }
      if (d > 15) { this.x = tx; this.y = ty; }
      this.cd -= dt;
      if (this.cd <= 0) {
        const t = G.game.nearestEnemy(this.x, this.y, 7.5, true);
        if (t) {
          this.cd = 0.9;
          const dmg = this.dmg;
          G.game.spawnProjectile({ x: this.x, y: this.y, z: 34, tx: t.x, ty: t.y, speed: 13, team: 'player', art: 'spark', src: p, r: 0.2,
            pkt: () => ({ elec: U.rand(dmg[0], dmg[1]) * p.stats.elecPct, statuses: [] }) });
          G.Audio.play('zap', 0.35, this.x, this.y);
        } else this.cd = 0.3;
      }
    }
    die() { if (!this.alive) return; this.alive = false; G.FX.sparks(this.x, this.y, 34, 10); G.FX.debris(this.x, this.y, 34, 5); }
    draw(c, sx, sy, t) {
      c.fillStyle = 'rgba(0,0,0,0.25)'; c.beginPath(); c.ellipse(sx, sy, 9, 4, 0, 0, 7); c.fill();
      c.save(); c.translate(sx, sy); G.Art.drone(c, this, t); c.restore();
    }
  }
  G.Drone = Drone;
})();


/* ==== src/entities/enemy.js ==== */
/* =====================================================================
 * Enemigos: basura viviente con rarezas (normal, mutante, campeón,
 * único), afijos y 12 comportamientos de IA distintos.
 * ===================================================================== */
'use strict';
(function () {
  const U = G.U;

  function scaleStat(base, L, lin, quad = 0) { return base * (1 + lin * (L - 1)) * (1 + quad * (L - 1) * (L - 1)); }

  class Enemy extends G.Unit {
    constructor(def, level, rarity = 'normal', opts = {}) {
      super({ team: 'enemy', r: def.radius, height: def.height });
      const P = G.Data.progression, M = P.monsterScaling, RM = P.rarityMods[rarity];
      this.def = def; this.kind = def.id; this.level = level; this.rarity = rarity;
      this.boss = !!def.boss;
      this.affixes = opts.affixes || [];
      const demoLife = G.game.demo ? 0.85 : 1;
      this.maxLife = Math.round(scaleStat(def.life, level, M.lifeLin, M.lifeQuad) * RM.life * demoLife * (this.affixes.includes('acorazado') ? 1.2 : 1));
      if (this.boss) this.maxLife = Math.round(def.life * demoLife);
      this.life = this.maxLife;
      const dm = scaleStat(1, level, M.dmgLin, M.dmgQuad) * RM.dmg;
      this.dmg = this.boss ? def.dmg.slice() : [def.dmg[0] * dm, def.dmg[1] * dm];
      this.dmgType = def.dmgType;
      this.ar = this.boss ? def.ar : scaleStat(def.ar, level, M.arLin);
      this.defense = this.boss ? def.def : scaleStat(def.def, level, M.defLin);
      this.armor = this.boss ? def.armor : def.armor * (1 + 0.15 * (level - 1));
      this.res = Object.assign({ elec: 0, tox: 0, fire: 0, mag: 0 }, def.res);
      if (rarity !== 'normal') for (const k in this.res) this.res[k] = Math.min(75, this.res[k] + (rarity === 'mutant' ? 5 : 10));
      this.speed = def.speed * (this.affixes.includes('veloz') ? 1.5 : 1);
      this.attackSpeed = def.attackSpeed * (this.affixes.includes('veloz') ? 1.4 : 1);
      this.xp = this.boss ? def.xp : Math.round(scaleStat(def.xp, level, M.xpLin) * RM.xp);
      this.scale = RM.scale * (opts.scale || 1);
      this.r = def.radius * this.scale;
      this.block = def.block || 0;
      this.onHit = def.onHit || [];
      this.heavy = this.rarity === 'unique' || this.boss || def.ai === 'elite';
      this.colors = def.colors.slice();
      if (rarity === 'mutant') this.colors = this.colors.map((c) => U.mix(c, '#5aa03a', 0.35));
      this.name = def.name;
      if (rarity === 'mutant') this.name += ' Mutante';
      if (rarity === 'unique') { const N = G.Data.uniqueNames; this.name = U.pick(N.first) + ' ' + U.pick(N.second); }
      this.title = rarity === 'champion' ? 'Campeón' : rarity === 'unique' ? def.name : def.title || '';
      this.state = 'idle'; this.home = { x: opts.x, y: opts.y };
      this.x = opts.x; this.y = opts.y;
      this.atkCD = U.rand(0.2, 1); this.thinkT = U.rand(0, 0.3); this.pathT = 0; this.path = null;
      this.aggro = false; this.special = {}; this.deathT = 0;
      this.summoned = opts.summoned || false;
      this.lastHit = 99;
      this.leader = opts.leader || null;
      if (def.ai === 'burrower') { this.burrowed = true; this.invulnerable = true; }
      if (this.boss && G.Bosses[def.boss]) G.Bosses[def.boss].init(this);
    }

    // ---------- IA ----------
    update(dt) {
      if (!this.alive) { this.deathT += dt; return; }
      const p = G.game.player;
      this.flash = Math.max(0, this.flash - dt);
      this.lastHit += dt;
      this.updateStatuses(dt);
      if (!this.alive) return;
      this.applyKnock(dt, G.game.map);
      this.atkCD -= dt;
      if (this.atkAnim > 0) { this.atkAnim += dt * 2.5; if (this.atkAnim >= 1) this.atkAnim = 0; }
      // regeneración
      if (this.def.regen && this.lastHit > 2) this.life = Math.min(this.maxLife, this.life + this.maxLife * this.def.regen * dt);
      // rastro
      this.trailT = (this.trailT || 0) - dt;
      const trail = this.def.trail || (this.affixes.includes('toxico') ? 'toxic' : null);
      if (trail && this.moving && this.trailT <= 0) {
        this.trailT = trail === 'fire' ? 0.5 : 1.1;
        const dps = this.dmg[1] * (trail === 'fire' ? 0.8 : 0.5);
        G.FX.area({ x: this.x, y: this.y, r: 0.7, dur: trail === 'fire' ? 2.5 : 4, dps, team: 'enemy', type: trail, dmgType: trail === 'fire' ? 'fire' : 'tox', status: trail === 'acid' ? { type: 'corrosion', dur: 3, power: 0.2 } : trail === 'toxic' ? { type: 'poison', dur: 2, power: 0.3, dpsAbs: dps * 0.4 } : null, src: this });
      }
      this.affixUpdate(dt, p);
      if (this.stunned) { this.moving = false; return; }
      if (!p.alive) { this.moving = false; this.state = 'idle'; return; }
      const d = U.dist(this.x, this.y, p.x, p.y);
      if (!this.aggro) {
        if (d < 9 || (this.leader && this.leader.aggro)) this.aggro = true;
        else { this.wander(dt); return; }
      }
      if (this.boss) { G.Bosses[this.def.boss].update(this, dt, p, d); return; }
      const AI = Enemy.AI[this.def.ai] || Enemy.AI.melee;
      AI.call(this, dt, p, d);
    }

    wander(dt) {
      this.moving = false;
      this.thinkT -= dt;
      if (this.thinkT <= 0) {
        this.thinkT = U.rand(2, 5);
        if (Math.random() < 0.5) this.wanderTo = { x: this.home.x + U.rand(-2.5, 2.5), y: this.home.y + U.rand(-2.5, 2.5) }; else this.wanderTo = null;
      }
      if (this.wanderTo) this.moveToward(this.wanderTo.x, this.wanderTo.y, dt, 0.4, 0.15);
    }

    // movimiento con evitación de muros y separación
    moveToward(tx, ty, dt, speedMult = 1, stopDist = 0.2) {
      const map = G.game.map;
      let gx = tx, gy = ty;
      this.pathT -= dt;
      const d = U.dist(this.x, this.y, tx, ty);
      if (d <= stopDist) { this.moving = false; return true; }
      if (this.pathT <= 0) {
        this.pathT = U.rand(0.5, 0.9);
        if (d < 18 && !G.PF.los(map, this.x, this.y, tx, ty, this.r * 0.8)) {
          const path = G.PF.find(map, this.x, this.y, tx, ty, 900);
          this.path = path ? G.PF.smooth(map, this.x, this.y, path, this.r * 0.8) : null;
        } else this.path = null;
      }
      if (this.path && this.path.length) {
        [gx, gy] = this.path[0];
        if (U.dist(this.x, this.y, gx, gy) < 0.3) { this.path.shift(); if (this.path.length) [gx, gy] = this.path[0]; }
      }
      let dx = gx - this.x, dy = gy - this.y; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
      // separación
      for (const o of G.game.enemiesNear(this.x, this.y, 1.2)) {
        if (o === this || !o.alive) continue;
        const ox = this.x - o.x, oy = this.y - o.y, od = Math.hypot(ox, oy);
        const min = this.r + o.r;
        if (od > 0.001 && od < min) { dx += ox / od * 0.6; dy += oy / od * 0.6; }
      }
      const L2 = Math.hypot(dx, dy) || 1;
      const sp = this.speed * speedMult * this.slowMult * dt;
      const moved = map.move(this, dx / L2 * sp, dy / L2 * sp);
      this.moving = true; this.walkT += dt * this.speed * speedMult;
      const sx = dx - dy; if (Math.abs(sx) > 0.05) this.face = sx > 0 ? 1 : -1;
      if (!moved) this.pathT = Math.min(this.pathT, 0.1);
      return false;
    }
    faceTo(x, y) { const sx = (x - this.x) - (y - this.y); if (Math.abs(sx) > 0.05) this.face = sx > 0 ? 1 : -1; }

    meleeTarget(p) {
      // a veces los enemigos atacan a los drones cercanos
      for (const a of G.game.allies) if (a.alive && U.dist(this.x, this.y, a.x, a.y) < 1.6 && U.dist(this.x, this.y, p.x, p.y) > 2.5) return a;
      return p;
    }

    doMelee(p, d) {
      const tgt = this.meleeTarget(p);
      const dd = tgt === p ? d : U.dist(this.x, this.y, tgt.x, tgt.y);
      if (dd <= this.def.attackRange + tgt.r + this.r * 0.5) {
        this.moving = false;
        this.faceTo(tgt.x, tgt.y);
        if (this.atkCD <= 0) {
          this.atkCD = 1 / this.attackSpeed;
          this.atkAnim = 0.01;
          this.pendingHit = { t: 0.18, tgt };
        }
      } else this.moveToward(tgt.x, tgt.y, G.game.dt);
      if (this.pendingHit) {
        this.pendingHit.t -= G.game.dt;
        if (this.pendingHit.t <= 0) {
          const t = this.pendingHit.tgt; this.pendingHit = null;
          if (t.alive && U.dist(this.x, this.y, t.x, t.y) <= this.def.attackRange + t.r + this.r + 0.4) {
            G.Combat.enemyAttack(this, t);
            G.Audio.play(this.def.art === 'bag' ? 'plastic' : 'hit', 0.5, this.x, this.y);
          }
        }
      }
    }

    shoot(p, opts = {}) {
      const pd = this.def.projectile || { art: 'glass', speed: 9, radius: 0.2 };
      const n = opts.count || pd.spread || 1;
      const base = Math.atan2(p.y - this.y, p.x - this.x);
      for (let i = 0; i < n; i++) {
        const a = base + (i - (n - 1) / 2) * 0.22;
        G.game.spawnProjectile({ x: this.x, y: this.y, z: this.height * this.scale * 0.6, tx: this.x + Math.cos(a) * 10, ty: this.y + Math.sin(a) * 10, speed: pd.speed, team: 'enemy', art: pd.art, src: this, r: pd.radius, range: this.def.attackRange + 3,
          pkt: () => { const k = G.Combat.enemyPacket(this); k.statuses = this.onHit.slice(); k.ranged = true; return k; }, rollHit: true });
      }
      G.Audio.play(pd.art === 'fireball' ? 'fire' : pd.art === 'static' ? 'zap' : pd.art === 'laser' ? 'shoot' : 'whoosh', 0.5, this.x, this.y);
    }

    rangedBehavior(dt, p, d, keep) {
      const map = G.game.map;
      const los = d < this.def.attackRange && G.PF.los(map, this.x, this.y, p.x, p.y);
      if (d < keep && los) {
        // retroceder
        const a = Math.atan2(this.y - p.y, this.x - p.x);
        this.moveToward(this.x + Math.cos(a) * 2, this.y + Math.sin(a) * 2, dt, 0.8, 0.1);
      } else if (!los) this.moveToward(p.x, p.y, dt);
      else this.moving = false;
      if (los && this.atkCD <= 0) {
        this.faceTo(p.x, p.y);
        this.atkCD = 1 / this.attackSpeed * U.rand(0.85, 1.2);
        this.atkAnim = 0.01;
        this.pendingShot = 0.3;
      }
      if (this.pendingShot !== undefined && this.pendingShot !== null) {
        this.pendingShot -= dt;
        if (this.pendingShot <= 0) { this.pendingShot = null; if (this.alive && !this.stunned) this.shoot(p); }
      }
    }

    affixUpdate(dt, p) {
      if (!this.affixes.length || !this.aggro) return;
      const sp = this.special;
      if (this.affixes.includes('magnetizado')) {
        sp.mag = (sp.mag || 2) - dt;
        if (sp.mag <= 0) {
          sp.mag = 4;
          const d = U.dist(this.x, this.y, p.x, p.y);
          if (d < 7 && d > 1.5) { p.kvx = (this.x - p.x) / d * 6; p.kvy = (this.y - p.y) / d * 6; G.FX.ring(this.x, this.y, 6, 0.5, '#c07bff', 0.5, 3); G.Audio.play('magnet', 0.6, this.x, this.y); }
        }
      }
      if (this.affixes.includes('invocador')) {
        sp.sum = (sp.sum || 3) - dt;
        if (sp.sum <= 0) {
          sp.sum = 7;
          const mine = G.game.enemies.filter((e) => e.alive && e.summoner === this).length;
          if (mine < 4) {
            for (let i = 0; i < 2; i++) {
              const e = G.game.spawnEnemy('bolsa', this.x + U.rand(-1, 1), this.y + U.rand(-1, 1), Math.max(1, this.level - 1), 'normal', { summoned: true });
              if (e) { e.summoner = this; e.aggro = true; }
            }
            G.FX.smoke(this.x, this.y, 20, 6, 'rgba(255,106,213,0.4)');
          }
        }
      }
    }

    onDamaged(v, pkt, src) {
      this.aggro = true;
      if (this.leader) this.leader.aggro = true;
      if (this.affixes.includes('electrificado') && Math.random() < 0.3) {
        G.FX.elec(this.x, this.y, 25, 10);
        G.Combat.aoePlayer(this.x, this.y, 1.8, { elec: this.dmg[1] * 0.5, noBlock: true }, this);
      }
      if (this.def.ai === 'swarmcloud' && v > this.maxLife * 0.12 && !this.dispersed) { this.dispersed = 1.3; this.dmgTakenMult = 0.3; }
      if (this.def.ai === 'smart' && !this.special.called && this.life < this.maxLife * 0.5) {
        this.special.called = true;
        G.FX.text(this.x, this.y, '¡REFUERZOS!', '#ff3a2a', 14, { z: 70 });
        G.Audio.play('warn', 1, this.x, this.y);
        for (let i = 0; i < 2; i++) {
          const a = Math.random() * 6.28;
          const e = G.game.spawnEnemy(this.def.reinforce || 'lata', this.x + Math.cos(a) * 2, this.y + Math.sin(a) * 2, this.level, 'normal', { summoned: true });
          if (e) { e.aggro = true; G.FX.smoke(e.x, e.y, 10, 6); }
        }
      }
      if (this.boss && G.Bosses[this.def.boss].onDamaged) G.Bosses[this.def.boss].onDamaged(this, v);
      void src;
    }

    die(src) {
      if (!this.alive) return;
      this.alive = false; this.life = 0; this.deathT = 0;
      this.invulnerable = true;
      const g = G.game;
      g.onEnemyKilled(this, src);
      // efectos de muerte
      const art = this.def.art;
      if (['bag'].includes(art)) { G.FX.burst(this.x, this.y, 25, 12, { type: 'leaf', speed: 3, vz: 120, grav: 120, life: 1, color: this.colors, size: 3 }); G.Audio.play('die_plastic', 0.8, this.x, this.y); }
      else if (['goo', 'stinkPile'].includes(art)) { G.FX.goo(this.x, this.y, 20, 14, this.colors); G.Audio.play('die_goo', 0.8, this.x, this.y); }
      else if (art === 'bottle') { G.FX.burst(this.x, this.y, 25, 14, { type: 'chunk', speed: 4, vz: 200, grav: 600, life: 0.8, color: ['#8fd18f', '#3f9b4a', '#e0fff0'], size: 3 }); G.Audio.play('glass', 0.9, this.x, this.y); }
      else { G.FX.debris(this.x, this.y, this.height * 0.4, 10 + (this.boss ? 30 : 0), this.colors.concat(['#5a5e64'])); G.FX.sparks(this.x, this.y, 20, 6); G.Audio.play('die_metal', 0.8, this.x, this.y); }
      G.FX.smoke(this.x, this.y, 15, 3);
      const od = this.def.onDeath;
      if (od) {
        if (od.type === 'shrapnel') { G.Combat.aoePlayer(this.x, this.y, od.radius, { phys: U.rand(od.dmg[0], od.dmg[1]) * (1 + 0.2 * (this.level - 1)) }, this); G.FX.debris(this.x, this.y, 20, 12, ['#d9d4c8', '#b9372e']); }
        if (od.type === 'toxicCloud') { G.FX.area({ x: this.x, y: this.y, r: od.radius, dur: od.duration, dps: od.dmg[1] * (1 + 0.2 * (this.level - 1)), team: 'enemy', type: 'cloud', dmgType: 'tox', status: { type: 'poison', dur: 2, power: 0.3, dpsAbs: od.dmg[1] * 0.5 } }); G.Audio.play('toxic', 0.8, this.x, this.y); }
      }
      if (this.affixes.includes('explosivo')) {
        const x = this.x, y = this.y, dmg = this.dmg[1] * 1.6;
        G.FX.telegraph({ shape: 'circle', x, y, r: 2.2, dur: 0.9, color: '#ff8a2a', onFire: () => { G.Combat.aoePlayer(x, y, 2.2, { fire: dmg, noBlock: true }, null); G.FX.burst(x, y, 10, 30, { type: 'flame', speed: 5, vz: 150, grav: 100, life: 0.6, color: ['#ff8a2a', '#ffe14a', '#ff3a1a'], glow: true, size: 5 }); G.Audio.play('explosion', 1, x, y); G.Camera.addShake(6); } });
      }
    }

    draw(c, sx, sy, t) {
      const k = this.alive ? 1 : Math.max(0, 1 - this.deathT * 3);
      if (k <= 0) return;
      if (this.burrowed && this.alive) { c.save(); c.translate(sx, sy); G.Art.worm(c, this, t); c.restore(); return; }
      this.drawShadow(c, sx, sy);
      // auras de rareza
      if (this.rarity === 'champion' || this.rarity === 'unique') {
        const col = this.rarity === 'unique' ? '#ff9d2a' : (G.Data.monsterAffixes[this.affixes[0]] || {}).color || '#5aa2ff';
        const rr = this.r * 60;
        const gg = c.createRadialGradient(sx, sy, 2, sx, sy, rr);
        gg.addColorStop(0, U.alpha(col, 0.35 + Math.sin(t * 4) * 0.1)); gg.addColorStop(1, U.alpha(col, 0));
        c.fillStyle = gg; c.beginPath(); c.ellipse(sx, sy, rr, rr * 0.5, 0, 0, 7); c.fill();
      }
      c.save(); c.translate(sx, sy); c.scale(this.scale * k, this.scale * (this.alive ? 1 : k * 0.6 + 0.4));
      if (this.flash > 0 && c.filter !== undefined) c.filter = 'brightness(2.5)';
      else if (this.statuses.poison && c.filter !== undefined) c.filter = 'sepia(0.4) hue-rotate(40deg)';
      (G.Art[this.def.art] || G.Art.can)(c, this, t);
      if (c.filter !== undefined) c.filter = 'none';
      c.restore();
      if (this.alive) this.statusTint(c, sx, sy);
      // mini barra de vida
      if (this.alive && this.life < this.maxLife && !this.boss && this.lastHit < 4) {
        const w = 26, y = sy - this.height * this.scale - 12;
        c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(sx - w / 2 - 1, y - 1, w + 2, 4);
        c.fillStyle = this.rarity === 'normal' ? '#c0392b' : this.rarity === 'mutant' ? '#8fd13a' : '#ff9d2a';
        c.fillRect(sx - w / 2, y, w * this.life / this.maxLife, 2);
      }
    }
  }

  // ---------------------------------------------------------------
  // Comportamientos
  // ---------------------------------------------------------------
  const AI = {};
  AI.melee = function (dt, p, d) { this.doMelee(p, d); };
  AI.swarm = function (dt, p, d) {
    // se acercan en zigzag
    if (d > 2) {
      const a = Math.atan2(p.y - this.y, p.x - this.x) + Math.sin(G.game.time * 4 + this.seed) * 0.7;
      this.moveToward(this.x + Math.cos(a) * 2, this.y + Math.sin(a) * 2, dt, 1, 0);
    } else this.doMelee(p, d);
  };
  AI.skittish = function (dt, p, d) {
    const sp = this.special;
    if (!sp.fled && this.life < this.maxLife * (this.def.fleeHp || 0.4)) { sp.fled = true; sp.flee = 2.5; }
    if (sp.flee > 0) {
      sp.flee -= dt;
      const a = Math.atan2(this.y - p.y, this.x - p.x);
      this.moveToward(this.x + Math.cos(a) * 3, this.y + Math.sin(a) * 3, dt, 1.2, 0);
      if (Math.random() < dt * 4) G.FX.elec(this.x, this.y, 10, 2);
      return;
    }
    this.doMelee(p, d);
  };
  AI.ranged = function (dt, p, d) { this.rangedBehavior(dt, p, d, this.def.keepDistance || 4); };
  AI.caster = AI.ranged;
  AI.elite = function (dt, p, d) {
    if (d < 1.8) this.doMelee(p, d);
    else this.rangedBehavior(dt, p, d, this.def.keepDistance || 3);
  };
  AI.smart = function (dt, p, d) {
    if (d < 1.4) this.doMelee(p, d);
    else this.rangedBehavior(dt, p, d, this.def.keepDistance || 3.5);
  };
  AI.regen = AI.melee;
  AI.bomber = AI.melee;
  AI.charger = function (dt, p, d) {
    const sp = this.special;
    sp.cd = (sp.cd === undefined ? U.rand(1, 3) : sp.cd) - dt;
    this.rollAngle = (this.rollAngle || 0) + dt * (this.moving ? 6 : 0) * this.face;
    if (sp.wind > 0) {
      sp.wind -= dt; this.moving = false; this.charging = true;
      if (sp.wind <= 0) { sp.charge = (this.def.chargeRange + 2) / this.def.chargeSpeed; G.Audio.play('motor', 0.8, this.x, this.y); }
      return;
    }
    if (sp.charge > 0) {
      sp.charge -= dt; this.charging = true;
      const step = this.def.chargeSpeed * dt;
      this.rollAngle += dt * 30 * this.face;
      const moved = G.game.map.move(this, sp.dx * step, sp.dy * step);
      this.moving = true;
      if (Math.random() < 0.5) G.FX.smoke(this.x, this.y, 5, 1, 'rgba(90,80,70,0.4)');
      if (!sp.hitDone && U.dist(this.x, this.y, p.x, p.y) < this.r + p.r + 0.3) {
        sp.hitDone = true;
        G.Combat.enemyAttack(this, p, 1.5, { statuses: (this.def.chargeHit || []).slice(), knock: 6 });
        G.Camera.addShake(5); G.Audio.play('hit_heavy', 1);
      }
      if (!moved || sp.charge <= 0) { sp.charge = 0; this.charging = false; this.atkCD = 0.8; if (!moved) { G.FX.debris(this.x, this.y, 10, 5); G.Audio.play('hit', 0.6, this.x, this.y); } }
      return;
    }
    this.charging = false;
    if (sp.cd <= 0 && d > 2.5 && d < this.def.chargeRange && G.PF.los(G.game.map, this.x, this.y, p.x, p.y, this.r)) {
      sp.cd = this.def.chargeCooldown; sp.wind = 0.65; sp.hitDone = false;
      const a = Math.atan2(p.y - this.y, p.x - this.x); sp.dx = Math.cos(a); sp.dy = Math.sin(a);
      this.faceTo(p.x, p.y);
      G.FX.telegraph({ shape: 'line', x: this.x, y: this.y, x2: this.x + sp.dx * (this.def.chargeRange + 2), y2: this.y + sp.dy * (this.def.chargeRange + 2), width: this.r * 2 + 0.3, dur: 0.65, color: '#ffb02a' });
      return;
    }
    this.doMelee(p, d);
  };
  AI.burrower = function (dt, p, d) {
    const sp = this.special;
    if (this.burrowed) {
      this.invulnerable = true;
      if (d > 2.6) { this.moveToward(p.x, p.y, dt, 1.1, 2.4); if (Math.random() < dt * 6) G.FX.debris(this.x, this.y, 2, 1, ['#5a4a36', '#3a2e22']); }
      else { this.burrowed = false; this.emerge = 0; sp.up = 2.6; sp.lunged = false; G.Audio.play('break_box', 0.7, this.x, this.y); G.FX.debris(this.x, this.y, 5, 10, ['#5a4a36', '#3a2e22']); }
      return;
    }
    this.invulnerable = false;
    this.moving = false;
    this.emerge = Math.min(1, (this.emerge || 0) + dt * 3);
    sp.up -= dt;
    if (!sp.lunged && this.emerge >= 1) {
      sp.lunged = true;
      const a = Math.atan2(p.y - this.y, p.x - this.x);
      const L = this.def.attackRange, x2 = this.x + Math.cos(a) * L, y2 = this.y + Math.sin(a) * L;
      this.faceTo(p.x, p.y);
      G.FX.telegraph({ shape: 'line', x: this.x, y: this.y, x2, y2, width: 0.9, dur: 0.55, color: '#ff3a2a', onFire: () => {
        if (!this.alive) return;
        this.lunge = 1; setTimeout(() => (this.lunge = 0), 250);
        const pl = G.game.player;
        // distancia del jugador al segmento
        const vx = x2 - this.x, vy = y2 - this.y, wx = pl.x - this.x, wy = pl.y - this.y;
        const tt = U.clamp((wx * vx + wy * vy) / (vx * vx + vy * vy), 0, 1);
        if (U.dist(pl.x, pl.y, this.x + vx * tt, this.y + vy * tt) < 0.6 + pl.r) G.Combat.enemyAttack(this, pl, 1.2);
        G.Audio.play('whoosh', 0.8, this.x, this.y);
      } });
    }
    if (sp.up <= 0) { this.burrowed = true; G.FX.debris(this.x, this.y, 5, 8, ['#5a4a36', '#3a2e22']); }
  };
  AI.swarmcloud = function (dt, p, d) {
    if (this.dispersed) {
      this.dispersed -= dt;
      const a = Math.atan2(this.y - p.y, this.x - p.x);
      this.moveToward(this.x + Math.cos(a) * 2, this.y + Math.sin(a) * 2, dt, 1.2, 0);
      if (this.dispersed <= 0) { this.dispersed = 0; this.dmgTakenMult = 1; }
      return;
    }
    if (d > this.def.aoe * 0.7) this.moveToward(p.x, p.y, dt, 1, this.def.aoe * 0.6);
    else this.moving = false;
    if (d <= this.def.aoe + p.r && this.atkCD <= 0) {
      this.atkCD = 1 / this.attackSpeed;
      G.Combat.enemyAttack(this, p, 0.8);
      G.FX.burst(p.x, p.y, 25, 4, { type: 'chunk', speed: 3, vz: 80, grav: 300, life: 0.4, color: this.colors, size: 2 });
    }
  };
  AI.boss = function () {};
  Enemy.AI = AI;

  G.Enemy = Enemy;
})();

'use strict';
(function () {
  const U = G.U;
  const B = {};
  const dmgOf = (e, mult = 1) => U.rand(e.dmg[0], e.dmg[1]) * mult;
  const tele = (o) => G.FX.telegraph(o);
  function cd(e, k, dt) { e.special[k] = (e.special[k] || 0) - dt; return e.special[k] <= 0; }
  function set(e, k, v) { e.special[k] = v; }
  function summon(e, id, n, lvl, radius = 2.5) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28;
      const m = G.game.spawnEnemy(id, e.x + Math.cos(a) * radius, e.y + Math.sin(a) * radius, lvl || e.level, 'normal', { summoned: true });
      if (m) { m.aggro = true; G.FX.smoke(m.x, m.y, 10, 5); }
    }
  }
  function slamAt(x, y, r, dmg, type, delay, color, src, after) {
    tele({ shape: 'circle', x, y, r, dur: delay, color, onFire: () => {
      const pkt = { noBlock: true }; pkt[type] = dmg;
      G.Combat.aoePlayer(x, y, r, pkt, src);
      G.FX.debris(x, y, 5, 10, ['#5a5e64', '#8f9399', '#3a3a44']);
      G.FX.ring(x, y, 0.3, r, color, 0.4, 4);
      G.Audio.play('slam', 0.9, x, y); G.Camera.addShake(5);
      if (after) after();
    } });
  }

  // ---------------------------------------------------------------
  B.tireKing = {
    init(e) { e.special = { charge: 3, spin: 7, summon: 10 }; },
    update(e, dt, p, d) {
      e.rollAngle = (e.rollAngle || 0) + dt * (e.moving ? 4 : 0);
      const sp = e.special;
      const enraged = e.life < e.maxLife * 0.5;
      if (sp.state === 'spinWait') { e.moving = false; e.spinning = true; return; }
      if (sp.state === 'wind') {
        sp.t -= dt; e.moving = false;
        if (sp.t <= 0) { sp.state = 'charge'; sp.t = 9 / 11; sp.hit = false; G.Audio.play('motor', 1, e.x, e.y); }
        return;
      }
      if (sp.state === 'charge') {
        sp.t -= dt; e.spinning = false;
        const moved = G.game.map.move(e, sp.dx * 11 * dt, sp.dy * 11 * dt);
        e.moving = true; e.rollAngle += dt * 20;
        G.FX.smoke(e.x, e.y, 5, 1, 'rgba(60,60,60,0.4)');
        if (!sp.hit && U.dist(e.x, e.y, p.x, p.y) < e.r + p.r + 0.3) { sp.hit = true; G.Combat.enemyAttack(e, p, 1.6, { statuses: [{ type: 'stun', dur: 1, power: 1 }], knock: 8 }); G.Camera.addShake(7); }
        if (!moved || sp.t <= 0) {
          sp.state = null; G.Camera.addShake(4);
          if (sp.chain > 0) { sp.chain--; B.tireKing.startCharge(e, p); }
        }
        return;
      }
      if (sp.state === 'spin') {
        sp.t -= dt; e.spinning = true; sp.tick -= dt;
        e.moveToward(p.x, p.y, dt, 0.6, 0);
        if (sp.tick <= 0) { sp.tick = 0.4; G.Combat.aoePlayer(e.x, e.y, 3, { phys: dmgOf(e, 0.5), noBlock: true }, e); G.FX.debris(e.x, e.y, 10, 4, ['#1f1f22', '#38383c']); }
        if (sp.t <= 0) { sp.state = null; e.spinning = false; }
        return;
      }
      if (cd(e, 'summon', dt)) { set(e, 'summon', 14); summon(e, 'neumatico', enraged ? 3 : 2, e.level - 1); G.Audio.play('roar', 0.7, e.x, e.y); }
      if (cd(e, 'spin', dt)) {
        set(e, 'spin', enraged ? 7 : 10);
        tele({ shape: 'circle', x: e.x, y: e.y, r: 3, dur: 1, color: '#ffb02a', onFire: () => { sp.state = 'spin'; sp.t = 2.2; sp.tick = 0; } });
        sp.state = 'spinWait';
        return;
      }
      if (cd(e, 'charge', dt) && d > 3) { set(e, 'charge', enraged ? 4 : 6); sp.chain = enraged ? 1 : 0; B.tireKing.startCharge(e, p); return; }
      e.doMelee(p, d);
    },
    startCharge(e, p) {
      const sp = e.special;
      const a = Math.atan2(p.y - e.y, p.x - e.x); sp.dx = Math.cos(a); sp.dy = Math.sin(a);
      sp.state = 'wind'; sp.t = 0.8;
      tele({ shape: 'line', x: e.x, y: e.y, x2: e.x + sp.dx * 9, y2: e.y + sp.dy * 9, width: 2.2, dur: 0.8, color: '#ffb02a' });
    },
  };

  // ---------------------------------------------------------------
  B.stinkPile = {
    init(e) { e.special = { bags: 3, puddle: 5, slam: 2 }; e.heavy = true; },
    update(e, dt, p, d) {
      const enraged = e.life < e.maxLife * 0.5;
      if (Math.random() < dt * 3) G.FX.part({ x: e.x + U.rand(-1, 1), y: e.y + U.rand(-1, 1), z: U.rand(20, 80), vz: 20, life: 1.5, color: 'rgba(140,200,60,0.3)', size: 12, type: 'smoke', drag: 0.95 });
      if (cd(e, 'bags', dt)) {
        set(e, 'bags', enraged ? 7 : 10);
        summon(e, 'bolsa_negra', enraged ? 5 : 4, e.level - 1, 2);
        G.Audio.play('die_goo', 1, e.x, e.y); G.FX.text(e.x, e.y, '¡BLURGH!', '#9dff3a', 16, { z: 110 });
      }
      if (cd(e, 'puddle', dt)) {
        set(e, 'puddle', enraged ? 4 : 6);
        const n = enraged ? 5 : 3;
        for (let i = 0; i < n; i++) {
          const x = p.x + (i ? U.rand(-3, 3) : 0), y = p.y + (i ? U.rand(-3, 3) : 0);
          tele({ shape: 'circle', x, y, r: 1.6, dur: 1.2, color: '#9dff3a', onFire: () => {
            G.FX.area({ x, y, r: 1.6, dur: 6, dps: dmgOf(e, 0.7), team: 'enemy', type: 'toxic', dmgType: 'tox', status: { type: 'poison', dur: 2, power: 0.3, dpsAbs: e.dmg[0] * 0.4 } });
            G.FX.goo(x, y, 30, 10); G.Audio.play('toxic', 0.7, x, y);
          } });
        }
        e.atkAnim = 0.01;
      }
      if (d < 3 && cd(e, 'slam', dt)) {
        set(e, 'slam', 3);
        slamAt(e.x + (p.x - e.x) * 0.6, e.y + (p.y - e.y) * 0.6, 2.2, dmgOf(e, 1.3), 'tox', 0.8, '#9dff3a', e);
        e.atkAnim = 0.01;
        return;
      }
      if (d > 2) e.moveToward(p.x, p.y, dt, 1, 1.8); else e.moving = false;
    },
  };

  // ---------------------------------------------------------------
  B.motherWasher = {
    init(e) { e.special = { laundry: 2, spin: 8, slam: 3, sum1: false, sum2: false }; e.heavy = true; },
    update(e, dt, p, d) {
      const sp = e.special;
      if (sp.state === 'spin') {
        sp.t -= dt; sp.tick -= dt; e.spinning = true; e.moving = false;
        const dd = U.dist(e.x, e.y, p.x, p.y);
        if (dd < 7 && dd > 0.5) { const k = 2.4 * dt; G.game.map.move(p, (e.x - p.x) / dd * k, (e.y - p.y) / dd * k); }
        if (sp.tick <= 0) { sp.tick = 0.35; G.Combat.aoePlayer(e.x, e.y, 3.2, { phys: dmgOf(e, 0.45), noBlock: true }, e); }
        if (Math.random() < 0.6) { const a = Math.random() * 6.28; G.FX.part({ x: e.x + Math.cos(a) * 3, y: e.y + Math.sin(a) * 3, z: 10, vx: -Math.sin(a) * 6, vy: Math.cos(a) * 6, life: 0.4, color: 'rgba(160,220,255,0.7)', size: 3, type: 'bubble' }); }
        if (sp.t <= 0) { sp.state = null; e.spinning = false; }
        return;
      }
      if (!sp.sum1 && e.life < e.maxLife * 0.66) { sp.sum1 = true; summon(e, 'lavadora', 2, e.level - 1, 3); G.Audio.play('roar', 1, e.x, e.y); }
      if (!sp.sum2 && e.life < e.maxLife * 0.33) { sp.sum2 = true; summon(e, 'microondas', 2, e.level - 1, 3); summon(e, 'lavadora', 1, e.level - 1, 3); G.Audio.play('roar', 1, e.x, e.y); }
      if (cd(e, 'spin', dt)) {
        set(e, 'spin', 11);
        tele({ shape: 'circle', x: e.x, y: e.y, r: 3.2, dur: 1.2, color: '#3fa8ff', onFire: () => { sp.state = 'spin'; sp.t = 3.2; sp.tick = 0; G.Audio.play('motor', 1, e.x, e.y); } });
        G.FX.text(e.x, e.y, '¡CENTRIFUGADO!', '#3fa8ff', 16, { z: 130 });
        return;
      }
      if (cd(e, 'laundry', dt) && d < 10) {
        set(e, 'laundry', e.life < e.maxLife * 0.5 ? 2.2 : 3);
        const base = Math.atan2(p.y - e.y, p.x - e.x);
        for (let i = 0; i < 5; i++) {
          const a = base + (i - 2) * 0.25;
          G.game.spawnProjectile({ x: e.x, y: e.y, z: 60, tx: e.x + Math.cos(a) * 12, ty: e.y + Math.sin(a) * 12, speed: 8, team: 'enemy', art: 'cloth', src: e, r: 0.3, range: 13,
            color: U.pick(['#e6c229', '#c0392b', '#ffffff', '#2f6fd6', '#ff4fd8']), pkt: () => ({ phys: dmgOf(e, 0.6), statuses: [{ type: 'slow', dur: 1.5, power: 0.35 }], ranged: true }), rollHit: true });
        }
        e.atkAnim = 0.01; G.Audio.play('whoosh', 1, e.x, e.y);
      }
      if (d < 2.6 && cd(e, 'slam', dt)) { set(e, 'slam', 2.5); slamAt(p.x, p.y, 1.8, dmgOf(e, 1.2), 'phys', 0.7, '#ff3a2a', e); return; }
      if (d > 3) e.moveToward(p.x, p.y, dt, 1, 2.5); else e.moving = false;
    },
  };

  // ---------------------------------------------------------------
  // EL COMPACTADOR
  // ---------------------------------------------------------------
  B.compactor = {
    init(e) {
      e.special = { plates: 2.5, summon: 6, barrels: 4, sectors: 6, saw: 3, pulse: 4, swarm: 5, stomp: 2 };
      e.phase = 1; e.heavy = true; e.pressY = 0; e.immune = { stun: true, slow: true, confuse: true };
      e.home = { x: e.x, y: e.y };
    },
    update(e, dt, p, d) {
      const sp = e.special;
      e.moving = false;
      // animación de prensa
      if (sp.pressT > 0) { sp.pressT -= dt; e.pressY = Math.sin((1 - sp.pressT / 0.6) * Math.PI); } else e.pressY = Math.max(0, e.pressY - dt * 2);
      // transición de fase
      if (sp.trans > 0) {
        sp.trans -= dt;
        e.invulnerable = true;
        if (Math.random() < dt * 10) G.FX.sparks(e.x + U.rand(-2, 2), e.y + U.rand(-2, 2), U.rand(40, 180), 6);
        if (sp.trans <= 0) e.invulnerable = false;
        return;
      }
      const lifeK = e.life / e.maxLife;
      if (e.phase === 1 && lifeK < 0.66) return B.compactor.toPhase(e, 2);
      if (e.phase === 2 && lifeK < 0.33) return B.compactor.toPhase(e, 3);
      const fury = e.phase === 3 ? 0.7 : 1;
      const center = G.game.level.arenaCenter;

      // Fase 1+: placas aplastantes
      if (e.phase <= 2 && cd(e, 'plates', dt)) {
        set(e, 'plates', (e.phase === 1 ? 3.2 : 4.5));
        const n = e.phase === 1 ? 3 : 2;
        for (let i = 0; i < n; i++) {
          const x = i === 0 ? p.x : p.x + U.rand(-4, 4), y = i === 0 ? p.y : p.y + U.rand(-4, 4);
          slamAt(x, y, 2.1, dmgOf(e, 1.6), 'phys', 1.4, '#ff3a2a', e);
        }
        sp.pressT = 0.6;
      }
      if (e.phase === 1 && cd(e, 'summon', dt)) {
        set(e, 'summon', 11);
        for (let i = 0; i < 3; i++) {
          const a = Math.random() * 6.28;
          const m = G.game.spawnEnemy('lata_oxidada', center.x + Math.cos(a) * 10, center.y + Math.sin(a) * 10, 16, 'normal', { summoned: true });
          if (m) { m.aggro = true; G.FX.smoke(m.x, m.y, 10, 6); }
        }
        G.Audio.play('warn', 1);
      }
      // Fase 2: bidones tóxicos y suelo electrificado
      if (e.phase >= 2 && e.phase < 3 && cd(e, 'barrels', dt)) {
        set(e, 'barrels', 3.5);
        for (let i = 0; i < 3; i++) {
          const tx = p.x + U.rand(-3, 3), ty = p.y + U.rand(-3, 3);
          tele({ shape: 'circle', x: tx, y: ty, r: 1.8, dur: 1.1, color: '#9dff3a' });
          G.game.spawnProjectile({ x: e.x, y: e.y, z: 150, tx, ty, speed: 9, team: 'enemy', art: 'barrel', src: e, r: 0.3, lob: true, noCollide: true,
            onArrive: (pr) => { G.FX.area({ x: pr.x, y: pr.y, r: 1.8, dur: 5, dps: dmgOf(e, 0.6), team: 'enemy', type: 'cloud', dmgType: 'tox', status: { type: 'poison', dur: 2, power: 0.3, dpsAbs: e.dmg[0] * 0.4 } }); G.FX.goo(pr.x, pr.y, 10, 12); G.Audio.play('toxic', 0.8, pr.x, pr.y); } });
        }
      }
      if (e.phase >= 2 && cd(e, 'sectors', dt)) {
        set(e, 'sectors', e.phase === 3 ? 9 : 6.5);
        const base = Math.floor(Math.random() * 6);
        const picks = e.phase === 3 ? [base] : [base, (base + 3) % 6];
        if (e.phase === 2) { const pa = Math.atan2(p.y - center.y, p.x - center.x); picks[0] = ((Math.round(pa / (Math.PI / 3)) % 6) + 6) % 6; }
        for (const s of picks) {
          const ang = s * Math.PI / 3;
          tele({ shape: 'sector', x: center.x, y: center.y, r: center.r, angle: ang, arc: Math.PI / 3, dur: 1.8, color: '#3fe0ff', onFire: () => {
            for (let rr = 2; rr < center.r; rr += 1.8) for (let k = -1; k <= 1; k++) {
              const a2 = ang + k * (Math.PI / 3) / 3;
              G.FX.area({ x: center.x + Math.cos(a2) * rr, y: center.y + Math.sin(a2) * rr, r: 1.3, dur: 3, dps: dmgOf(e, 0.5), team: 'enemy', type: 'elec', dmgType: 'elec', status: { type: 'slow', dur: 1, power: 0.3 } });
            }
            G.Audio.play('zap_big', 0.8);
          } });
        }
      }
      // Fase 3: sierras, pulsos magnéticos y enjambres
      if (e.phase === 3) {
        if (cd(e, 'saw', dt)) {
          set(e, 'saw', 3.2 * fury + 0.8);
          const a = Math.atan2(p.y - e.y, p.x - e.x);
          tele({ shape: 'sector', x: e.x, y: e.y, r: 9, angle: a, arc: 1.8, dur: 1.0, color: '#ff2bd6', onFire: () => {
            const pa = Math.atan2(p.y - e.y, p.x - e.x); let da = Math.abs(pa - a); if (da > Math.PI) da = Math.PI * 2 - da;
            if (da < 0.9 && U.dist(e.x, e.y, p.x, p.y) < 9 + p.r) G.Combat.applyDamage(p, { phys: dmgOf(e, 1.5), statuses: [{ type: 'bleed', dur: 3, power: 0.3 }] }, e);
            for (let i = 0; i < 20; i++) { const aa = a - 0.9 + 1.8 * i / 19; G.FX.part({ x: e.x + Math.cos(aa) * 6, y: e.y + Math.sin(aa) * 6, z: 20, vx: Math.cos(aa) * 4, vy: Math.sin(aa) * 4, vz: 60, grav: 200, life: 0.4, color: '#ffe14a', size: 2, type: 'spark', glow: true }); }
            G.Audio.play('saw', 1); G.Camera.addShake(4);
          } });
        }
        if (cd(e, 'pulse', dt)) {
          set(e, 'pulse', 5.5 * fury + 1);
          G.FX.ring(e.x, e.y, 12, 1, '#c07bff', 0.7, 6);
          const dd = U.dist(e.x, e.y, p.x, p.y);
          if (dd > 2) { p.kvx = (e.x - p.x) / dd * 9; p.kvy = (e.y - p.y) / dd * 9; }
          if (dd < 5) G.Combat.applyDamage(p, { mag: dmgOf(e, 0.8), noBlock: true }, e);
          G.Audio.play('magnet', 1);
        }
        if (cd(e, 'swarm', dt)) {
          set(e, 'swarm', 10);
          for (let i = 0; i < 2; i++) { const a = Math.random() * 6.28; const m = G.game.spawnEnemy('enjambre', center.x + Math.cos(a) * 9, center.y + Math.sin(a) * 9, 17, 'normal', { summoned: true }); if (m) m.aggro = true; }
        }
      }
      // pisotón si el jugador está demasiado cerca
      if (d < e.r + 2.5 && cd(e, 'stomp', dt)) { set(e, 'stomp', 2.5); slamAt(e.x, e.y + 1.5, 3.5, dmgOf(e, 1.1), 'phys', 0.9, '#ff3a2a', e); sp.pressT = 0.6; }
    },
    toPhase(e, ph) {
      e.phase = ph; e.special.trans = 2.2;
      G.Audio.play('roar', 1.2); G.Camera.addShake(10);
      G.FX.debris(e.x, e.y, 120, 40, ['#5c5f66', '#33353c', '#e6c229', '#ff2bd6']);
      G.FX.sparks(e.x, e.y, 120, 40);
      G.UI.banner(ph === 2 ? 'FASE 2: SOBRECARGA TÓXICA' : 'FASE 3: CARCASA DESPRENDIDA', ph === 2 ? 'Bidones tóxicos y suelo electrificado' : '¡Modo furioso!', '#ff2bd6');
      // limpiar convocados de la fase anterior para dar respiro
      if (ph === 3) e.dmgTakenMult = 1.15;
    },
  };

  G.Bosses = B;
})();


/* ==== src/entities/objects.js ==== */
/* =====================================================================
 * Objetos del mundo: proyectiles, botín en el suelo, contenedores
 * rompibles, cofres (normales y sellados), portales, Balizas,
 * minas, NPCs y decorados con luz.
 * ===================================================================== */
'use strict';
(function () {
  const U = G.U;
  const TAU = Math.PI * 2;

  // ---------------------------------------------------------------
  class Projectile {
    constructor(o) {
      Object.assign(this, { z: 30, speed: 10, r: 0.2, range: 12, pierce: 0, team: 'enemy', art: 'nail' }, o);
      const d = Math.hypot(o.tx - o.x, o.ty - o.y) || 1;
      this.vx = (o.tx - o.x) / d; this.vy = (o.ty - o.y) / d;
      this.dist = 0; this.total = this.lob ? d : this.range; this.z0 = this.z;
      this.hit = new Set(); this.dead = false; this.t = 0;
      this.ang = Math.atan2(this.vy, this.vx);
    }
    update(dt) {
      const step = this.speed * dt;
      this.x += this.vx * step; this.y += this.vy * step; this.dist += step; this.t += dt;
      const map = G.game.map;
      if (this.lob) {
        const k = Math.min(1, this.dist / this.total);
        this.z = U.lerp(this.z0, 5, k) + Math.sin(k * Math.PI) * Math.min(120, this.total * 14);
        if (k >= 1) { this.dead = true; if (this.onArrive) this.onArrive(this); }
        return;
      }
      if (this.dist >= this.total) { this.dead = true; if (this.onArrive) this.onArrive(this); return; }
      if (!this.noWall && !map.walkable(Math.floor(this.x), Math.floor(this.y))) {
        this.dead = true; G.FX.sparks(this.x - this.vx * 0.2, this.y - this.vy * 0.2, this.z, 4, this.art === 'spark' || this.art === 'static' ? ['#3fe0ff', '#fff'] : undefined);
        if (this.onArrive) this.onArrive(this);
        return;
      }
      if (this.noCollide) return;
      const targets = this.team === 'player' ? G.game.enemiesNear(this.x, this.y, 2.5) : [G.game.player].concat(G.game.allies);
      for (const t of targets) {
        if (!t || !t.alive || t.burrowed || this.hit.has(t)) continue;
        if (U.dist2(this.x, this.y, t.x, t.y) < (this.r + t.r) ** 2) {
          this.hit.add(t);
          if (this.rollHit && !G.Combat.rollHit(this.src, t)) { G.FX.text(t.x, t.y, 'Esquiva', '#bbb', 12, { z: 60 }); continue; }
          const pkt = typeof this.pkt === 'function' ? this.pkt() : Object.assign({}, this.pkt);
          G.Combat.applyDamage(t, pkt, this.src);
          this.impact(t);
          if (this.team === 'player' && this.src && this.src.isPlayer) { G.Combat.hitStop(0.02); }
          if (!(this.pierce && Math.random() < this.pierce)) { this.dead = true; return; }
        }
      }
    }
    impact(t) {
      const a = this.art;
      if (a === 'spark' || a === 'static') G.FX.elec(t.x, t.y, 25, 8);
      else if (a === 'fireball') G.FX.burst(t.x, t.y, 25, 10, { type: 'flame', speed: 3, vz: 80, life: 0.5, color: ['#ff8a2a', '#ffe14a'], glow: true, size: 4 });
      else if (a === 'acid') G.FX.goo(t.x, t.y, 25, 8, ['#c6ff3a', '#8fbf1a']);
      else if (a === 'glass') G.FX.burst(t.x, t.y, 25, 6, { type: 'chunk', speed: 3, vz: 100, grav: 400, life: 0.5, color: ['#8fd18f', '#e0fff0'], size: 2 });
      else G.FX.sparks(t.x, t.y, 25, 5);
      G.Audio.play(a === 'glass' ? 'glass' : a === 'spark' || a === 'static' ? 'zap' : 'hit', 0.5, t.x, t.y);
    }
    draw(c, sx, sy, t) {
      const s = { x: sx, y: sy - this.z };
      // sombra
      c.fillStyle = 'rgba(0,0,0,0.3)'; c.beginPath(); c.ellipse(sx, sy, 5, 2.5, 0, 0, TAU); c.fill();
      const sa = Math.atan2((this.vx + this.vy) * 0.5, this.vx - this.vy);
      c.save(); c.translate(s.x, s.y);
      switch (this.art) {
        case 'nail': c.rotate(sa); c.fillStyle = '#d0d4d8'; c.fillRect(-7, -1, 14, 2); c.fillRect(-8, -2.5, 2, 5); break;
        case 'bolt': c.rotate(sa); c.fillStyle = '#c8d0d8'; c.fillRect(-8, -1.5, 14, 3); c.fillStyle = '#8f9399'; c.fillRect(5, -3.5, 4, 7); c.strokeStyle = 'rgba(63,224,255,0.5)'; c.beginPath(); c.moveTo(-8, 0); c.lineTo(-22, 0); c.stroke(); break;
        case 'spark': case 'static': {

    update(dt) {

      else if (this.item && (this.item.kind === 'potion' || this.item.kind === 'scroll') && G.Options.get('autoLoot') && d < 0.7 && this.z === 0 && !this.failed) this.pick(p, true);

        c.beginPath(); c.arc(sx + 12, sy - 66, 4, 0, TAU); c.fill(); c.shadowBlur = 0;

        c.fillStyle = '#1a1a1e'; c.fillRect(sx - 24, sy - 60, 48, 22);
        c.strokeStyle = '#3a3a3e'; c.lineWidth = 2; c.beginPath(); c.moveTo(sx - 18, sy - 38); c.lineTo(sx - 18, sy); c.moveTo(sx + 18, sy - 38); c.lineTo(sx + 18, sy); c.stroke();
        const on = Math.sin(t * 7 + this.seed) > -0.85;
        c.fillStyle = on ? this.color : '#333'; c.shadowColor = this.color; c.shadowBlur = on ? 12 : 0;
        c.font = 'bold 11px "Chakra Petch", sans-serif'; c.textAlign = 'center'; c.fillText(this.text || 'REFUGIO', sx, sy - 45); c.shadowBlur = 0;
      } else if (this.kind === 'pedestal') {
        G.Sprites.isoBlock(c, sx, sy - 2, 12, '#6a5a3a', '#4a3a2a', '#2a2018');
        c.strokeStyle = '#8a4a20'; c.lineWidth = 3; c.beginPath(); c.moveTo(sx - 20, sy - 14); c.lineTo(sx - 20, sy - 50); c.lineTo(sx + 20, sy - 50); c.stroke();
      }
    }
    light() {
      if (this.kind === 'campfire') G.FX.light(this.x, this.y, 7, '#ff9d2a', 0.95);
      else if (this.kind === 'lamp' || this.kind === 'neon') G.FX.light(this.x, this.y, 4.5, this.color, 0.7);
    }
  }
  G.Prop = Prop;
})();


/* ==== src/levels/world.js ==== */
/* =====================================================================
 * Mundo: carga de zonas (generación + población), transiciones,
 * caché de zonas visitadas en la sesión, botín y aparición de enemigos.
 * Se mezcla dentro del objeto G.game (ver core/game.js).
 * ===================================================================== */
'use strict';
(function () {
  const U = G.U;
  const W = {};

  const CONTAINER_KINDS = { plains: ['box', 'bin', 'box'], tires: ['crate', 'bin'], sewer: ['crate', 'bin'], oil: ['crate', 'fridge', 'bin'], factory: ['fridge', 'crate'], mountain: ['crate', 'box', 'fridge'], core: ['crate'], town: ['crate'] };

  W.zoneSeed = function (id) {
    if (!this.seeds[id]) this.seeds[id] = (Math.random() * 1e9) | 0;
    return this.seeds[id];
  };

  // Genera (o recupera de la caché) una zona
  W.loadZone = function (id) {
    if (this.zoneCache[id]) return this.zoneCache[id];
    const zone = G.Data.zoneById[id];
    const rng = new U.RNG(this.zoneSeed(id));
    G.Sprites.buildTileset(zone.tileset);
    const sizeMult = this.demo && zone.gen !== 'arena' && zone.gen !== 'town' ? G.Data.progression.demo.sizeMult : 1;
    const gen = G.MapGen[zone.gen](zone, rng, sizeMult);
    // garantizar que los puntos clave son alcanzables desde el inicio
    const m = gen.map;
    m.computeDist(Math.floor(gen.start.x), Math.floor(gen.start.y));
    const snap = (pt) => {
      if (!pt || m.dist[m.idx(Math.floor(pt.x), Math.floor(pt.y))] >= 0) return;
      let best = null, bd = 1e9;
      for (let i = 0; i < m.dist.length; i++) if (m.dist[i] >= 0) { const x = i % m.w, y = (i / m.w) | 0, d = (x + 0.5 - pt.x) ** 2 + (y + 0.5 - pt.y) ** 2; if (d < bd && !m.blockedCircle(x + 0.5, y + 0.5, 0.5)) { bd = d; best = { x: x + 0.5, y: y + 0.5 }; } }
      if (best) { pt.x = best.x; pt.y = best.y; }
    };
    [gen.exit, gen.waypoint, gen.boss, gen.secret].forEach(snap);
    const z = { zone, gen, map: gen.map, enemies: [], objects: [], allies: [] };
    this.zoneCache[id] = z;
    // poblar
    const prev = this.map, prevE = this.enemies, prevO = this.objects;
    this.map = z.map; this.enemies = z.enemies; this.objects = z.objects;
    this.zone = zone;
    this.zoneLevel = Math.round((zone.level[0] + zone.level[1]) / 2);
    W.populate.call(this, z, rng, sizeMult);
    this.map = prev; this.enemies = prevE; this.objects = prevO;
    return z;
  };

  W.populate = function (z, rng, sizeMult) {
    const { zone, gen, map } = z;
    const idx = zone.index;
    const prevZone = G.Data.zones[idx - 1], nextZone = G.Data.zones[idx + 1];
    const taken = [{ x: gen.start.x, y: gen.start.y }];
    if (zone.gen === 'town') { W.populateTown.call(this, z); return; }
    // portales
    if (prevZone) z.objects.push(new G.Portal(gen.start.x - 1.5, gen.start.y + 1.5, { zone: prevZone.id, at: 'exit' }, 'Hacia: ' + prevZone.name, prevZone.id === 'town' ? 'town' : 'gate'));
    if (nextZone && gen.exit) z.objects.push(new G.Portal(gen.exit.x, gen.exit.y, { zone: nextZone.id, at: 'start' }, 'Hacia: ' + nextZone.name, nextZone.id === 'z7' ? 'boss' : 'gate'));
    if (gen.exit) taken.push(gen.exit);
    if (zone.waypoint && gen.waypoint) { z.objects.push(new G.Waypoint(gen.waypoint.x, gen.waypoint.y, zone.id)); taken.push(gen.waypoint); }
    // jefe
    if (zone.miniboss && gen.boss && !this.flags['boss_' + zone.miniboss]) {
      const def = G.Data.bosses[zone.miniboss];
      const e = new G.Enemy(def, zone.level[1] + 1, 'boss', { x: gen.boss.x, y: gen.boss.y });
      z.enemies.push(e);
      taken.push(gen.boss);
      if (zone.miniboss !== 'compactador') {
        // escolta
        const pool = Object.keys(zone.enemies || { lata: 1 });
        for (let i = 0; i < 3; i++) this.addEnemy(z, U.pick(pool), gen.boss.x + rng.range(-3, 3), gen.boss.y + rng.range(-3, 3), zone.level[1], 'mutant');
      }
    }
    if (zone.gen === 'arena') {
      z.objects.push(new G.Prop(gen.arenaCenter.x - 9, gen.arenaCenter.y + 9, 'lamp', '#ff2bd6'));
      z.objects.push(new G.Prop(gen.arenaCenter.x + 9, gen.arenaCenter.y + 9, 'lamp', '#ff2bd6'));
      z.objects.push(new G.Prop(gen.arenaCenter.x - 9, gen.arenaCenter.y - 9, 'lamp', '#3fe0ff'));
      z.objects.push(new G.Prop(gen.arenaCenter.x + 9, gen.arenaCenter.y - 9, 'lamp', '#3fe0ff'));
      return;
    }
    map.computeDist(Math.floor(gen.start.x), Math.floor(gen.start.y));
    let maxD = 1; for (let i = 0; i < map.dist.length; i++) if (map.dist[i] > maxD) maxD = map.dist[i];
    const area = sizeMult * sizeMult;
    const lvlAt = (d) => Math.round(U.lerp(zone.level[0], zone.level[1], U.clamp(d / maxD, 0, 1)));
    // objeto de misión (Pantanos de Aceite)
    if (zone.questItem && this.quests.q4.status !== 'done' && !this.hasQuestItem(zone.questItem)) {
      const far = G.MapGen.spawnSpots(map, rng, gen.start, 1, maxD * 0.75, 6, taken)[0];
      if (far) {
        G.MapGen.openSpot(map, Math.floor(far.x), Math.floor(far.y), 2.5);
        z.objects.push(new G.Prop(far.x, far.y - 0.6, 'pedestal'));
        const gi = new G.GroundItem(G.Items.questItem(zone.questItem), far.x, far.y + 0.3); gi.z = 0; gi.vz = 0;
        z.objects.push(gi);
        z.objects.push(new G.Prop(far.x + 2, far.y - 2, 'lamp', '#ffb02a'));
        this.spawnPack(z, rng, far.x + 1.5, far.y + 1.5, zone, lvlAt(far.d) + 1, 'unique');
      }
    }
    // grupos
    const nPacks = Math.round(zone.packs * area), nChamp = Math.max(1, Math.round(zone.champions * area)), nUnique = zone.uniques;
    const spots = G.MapGen.spawnSpots(map, rng, gen.start, nPacks + nChamp + nUnique, 11, 5.5, taken);
    spots.forEach((s, i) => {
      const rarity = i < nUnique ? 'unique' : i < nUnique + nChamp ? 'champion' : 'normal';
      this.spawnPack(z, rng, s.x, s.y, zone, lvlAt(s.d), rarity);
    });
    // contenedores y cofres
    const kinds = CONTAINER_KINDS[zone.tileset] || ['crate'];
    const cs = G.MapGen.spawnSpots(map, rng, gen.start, Math.round(zone.containers * area), 3, 2.5, taken);
    cs.forEach((s, i) => {
      if (i % 7 === 0) z.objects.push(new G.Chest(s.x, s.y, false));
      else z.objects.push(new G.Container(s.x, s.y, rng.pick(kinds), zone.tileset));
    });
    if (gen.secret) { z.objects.push(new G.Chest(gen.secret.x, gen.secret.y, true)); z.objects.push(new G.Prop(gen.secret.x + 1, gen.secret.y - 1, 'lamp', '#ff2bd6')); }
    // luces de ambiente (neones sucios)
    const ts = G.Data.tilesets[zone.tileset];
    const ls = G.MapGen.spawnSpots(map, rng, gen.start, Math.round(14 * area), 0, 8, taken.slice());
    ls.forEach((s) => z.objects.push(new G.Prop(s.x, s.y, 'lamp', rng.chance(0.6) ? ts.accent : rng.pick(['#ff9d2a', '#3fe0ff', '#ff4fd8', '#9dff3a']))));
  };

  W.populateTown = function (z) {
    const gen = z.gen;
    for (const n of G.Data.npcs) z.objects.push(new G.NPC(n));
    z.objects.push(new G.Prop(gen.campfire.x, gen.campfire.y, 'campfire'));
    z.objects.push(new G.Waypoint(gen.waypoint.x, gen.waypoint.y, 'town'));
    z.objects.push(new G.Portal(gen.exit.x, gen.exit.y, { zone: 'z1', at: 'start' }, 'Hacia: Llanura de Bolsas', 'gate'));
    const lamps = [[12, 16, '#ff9d2a'], [31, 16, '#ff9d2a'], [14, 30, '#3fe0ff'], [29, 28, '#9dff3a'], [36, 20, '#ff4fd8'], [36, 25, '#ff4fd8'], [22, 12, '#ff9d2a']];
    lamps.forEach(([x, y, c]) => z.objects.push(new G.Prop(x + 0.5, y + 0.5, 'lamp', c)));
    const neon = new G.Prop(27.5, 13.2, 'neon', '#ff9d2a'); neon.text = 'REFUGIO'; z.objects.push(neon);
    const neon2 = new G.Prop(12.5, 25.5, 'neon', '#3fe0ff'); neon2.text = 'TALLER'; z.objects.push(neon2);
    for (let i = 0; i < 5; i++) z.objects.push(new G.Container(10 + i * 1.2, 27.5 + (i % 2), 'crate', 'town'));
  };

  // Grupo de enemigos alrededor de un punto
  W.spawnPack = function (z, rng, x, y, zone, level, rarity) {
    const pool = zone.enemies;
    const type = rng.weighted(pool);
    const def = G.Data.enemies[type];
    const affixPool = Object.keys(G.Data.monsterAffixes);
    if (rarity === 'champion' || rarity === 'unique') {
      const n = rarity === 'unique' ? rng.int(2, 3) : rng.int(1, 2);
      const aff = rng.shuffle(affixPool.slice()).slice(0, n);
      const leader = this.addEnemy(z, type, x, y, level + 1, rarity, { affixes: aff });
      const m = rarity === 'unique' ? rng.int(3, 4) : rng.int(2, 3);
      for (let i = 0; i < m; i++) this.addEnemy(z, type, x + rng.range(-1.5, 1.5), y + rng.range(-1.5, 1.5), level, rarity === 'unique' ? 'mutant' : 'normal', { leader, affixes: rarity === 'champion' ? aff.slice(0, 1) : [] });
      return;
    }
    const n = rng.int(def.packSize[0], def.packSize[1]);
    const mutantP = 0.08 + zone.index * 0.02;
    for (let i = 0; i < n; i++) {
      const tp = i > 0 && rng.chance(0.25) ? rng.weighted(pool) : type;
      this.addEnemy(z, tp, x + rng.range(-1.6, 1.6), y + rng.range(-1.6, 1.6), level, rng.chance(mutantP) ? 'mutant' : 'normal');
    }
  };

  W.addEnemy = function (z, type, x, y, level, rarity, opts = {}) {
    const map = z.map;
    if (!map.walkable(Math.floor(x), Math.floor(y))) { const n = map.nearestWalkable(x, y, 3); if (!n) return null; x = n.x + 0.5; y = n.y + 0.5; }
    const e = new G.Enemy(G.Data.enemies[type], Math.max(1, level), rarity, Object.assign({ x, y }, opts));
    z.enemies.push(e);
    return e;
  };

  // Aparición en caliente (invocaciones)
  W.spawnEnemy = function (type, x, y, level, rarity = 'normal', opts = {}) {
    const z = this.zoneCache[this.zone.id];
    const e = this.addEnemy(z, type, x, y, level, rarity, opts);
    return e;
  };

  // ---------------- botín ----------------
  W.dropLoot = function (x, y, table, level, rolls = 1, rarityBonus = 0) {
    const T = G.Data.items.lootTables[table];
    const p = this.player;
    const dm = this.demo ? G.Data.progression.demo.dropMult : 1;
    for (let i = 0; i < rolls; i++) {
      const o = U.rng.weighted(T);
      if (o === 'nothing') { if (dm > 1 && Math.random() < (dm - 1) * 0.5) this.dropItem(G.Items.randomConsumable(level), x, y); continue; }
      if (o === 'gold') this.dropGold(G.Items.goldAmount(level, p.stats.goldFind), x, y);
      else if (o === 'potion') this.dropItem(G.Items.randomConsumable(level), x, y);
      else this.dropItem(G.Items.generate({ ilvl: level, mf: p.stats.magicFind, bonus: rarityBonus }), x, y);
    }
  };
  W.scatter = function (x, y) {
    for (let k = 0; k < 10; k++) {
      const a = Math.random() * 6.28, r = Math.random() * 1.2;
      const nx = x + Math.cos(a) * r, ny = y + Math.sin(a) * r;
      if (this.map.walkable(Math.floor(nx), Math.floor(ny))) return { x: nx, y: ny };
    }
    return { x, y };
  };
  W.dropItem = function (item, x, y) { const s = this.scatter(x, y); this.objects.push(new G.GroundItem(item, s.x, s.y)); };
  W.dropGold = function (n, x, y) { const s = this.scatter(x, y); this.objects.push(new G.GroundItem(null, s.x, s.y, n)); };

  W.hasQuestItem = function (qid) {
    const p = this.player;
    return !!(p.inv.items.find((e) => e.item.qid === qid) || p.stash.items.find((e) => e.item.qid === qid));
  };
  W.removeQuestItem = function (qid) {
    const p = this.player;
    for (const g of [p.inv, p.stash]) { const e = g.items.find((x) => x.item.qid === qid); if (e) g.remove(e.item); }
  };

  G.World = W;
})();

(function () {
  const U = G.U;

  const DOLL = { weapon: [0, 1, 2, 4], head: [4, 0, 2, 2], amulet: [6.6, 0.5, 1, 1], chest: [4, 2.2, 2, 3], offhand: [8, 1, 2, 3], hands: [0, 5.4, 2, 2], ring1: [2.6, 5.9, 1, 1], belt: [4, 5.6, 2, 1], ring2: [6.4, 5.9, 1, 1], feet: [8, 5.4, 2, 2] };
  const RAR_NAME = (it) => (it.kind === 'quest' ? 'Objeto de misión' : G.Data.items.rarities[it.rarity || 'common'].name);

  // ---------------------------------------------------------------
  UI.init = function () {

      <canvas id="minimap" class="hidden" width="360" height="360"></canvas>

  let marker = null;

  UI.drawClickMarker = function (c) {

    c.strokeStyle = U.alpha('#ffb02a', 1 - k); c.lineWidth = 2;
    c.beginPath(); c.ellipse(s.x, s.y, 14 * (1 - k * 0.5), 7 * (1 - k * 0.5), 0, 0, 7); c.stroke();
  };

  // ---------------------------------------------------------------
  // Ventanas
  // ---------------------------------------------------------------
  UI.isOpen = (n) => !!UI.open[n];
  UI.toggle = function (n, force) {
    const on = force !== undefined ? force : !UI.open[n];
    if (on) {
      if (LEFT.includes(n)) LEFT.forEach((k) => k !== n && UI.setOpen(k, false));
      if (CENTER.includes(n)) CENTER.forEach((k) => k !== n && UI.setOpen(k, false));
      if (n === 'shop' || n === 'stash') UI.setOpen('inventory', true);
    }
    UI.setOpen(n, on);
    if (!on && (n === 'shop' || n === 'stash')) UI.setOpen('inventory', false);
    G.Audio.play(on ? 'ui_open' : 'ui', 0.7);

  UI.update = function (dt) {

    if (!p) return;

      const id = el.dataset.skill; if (!id || id === 'attack') return;

      const ov = el.querySelector('.cd');

      el.classList.toggle('nomana', p.mana < G.Skills.cost(p, id));
    });
    // objetivo bajo el cursor
    const tg = $('#target');

    if (h && h.alive) {
      tg.classList.remove('hidden');
      tg.querySelector('.nm').textContent = h.name + (h.title && h.rarity !== 'normal' && h.rarity !== 'mutant' ? ' — ' + h.title : '');
      tg.querySelector('.nm').style.color = h.rarity === 'unique' ? '#ff9d2a' : h.rarity === 'champion' ? '#7fb2ff' : h.rarity === 'mutant' ? '#b8ff7a' : '#f2efe6';
      tg.querySelector('.af').textContent = h.affixes.map((a) => G.Data.monsterAffixes[a].name).join(' · ') + (h.affixes.length ? '' : 'Nivel ' + h.level);
      tg.querySelector('i').style.width = (h.life / h.maxLife * 100) + '%';
    } else tg.classList.add('hidden');
    // barra de jefe
    const boss = g.enemies.find((e) => e.boss && e.alive && e.aggro && U.dist(e.x, e.y, p.x, p.y) < 26);
    const bb = $('#bossbar');
    if (boss) {
      bb.classList.remove('hidden');
      bb.querySelector('.nm').textContent = boss.name;
      bb.querySelector('.tt').textContent = boss.def.title + (boss.phase ? ' — Fase ' + boss.phase + '/3' : '');
      bb.querySelector('i').style.width = (boss.life / boss.maxLife * 100) + '%';
      bb.querySelectorAll('.ph').forEach((e) => (e.style.display = boss.phase ? '' : 'none'));
    } else bb.classList.add('hidden');
    // buffs
    const bk = Object.keys(p.buffs).join(',');
    if (bk !== UI._bk) { UI._bk = bk; $('#buffs').innerHTML = Object.keys(p.buffs).map((id) => { const sk = G.Data.skills[id]; return `<div class="slot" data-tip="skill:${id}"><img src="${G.Sprites.skillIcon(sk.icon, branchColor(sk))}"><div class="t" data-buff="${id}"></div></div>`; }).join(''); }
    document.querySelectorAll('#buffs [data-buff]').forEach((el) => { const b = p.buffs[el.dataset.buff]; if (b) el.textContent = Math.ceil(b.t) + 's'; });
    // experiencia

    $('#xpI').style.width = (p.level >= G.Data.progression.maxLevel ? 100 : p.xp / need * 100) + '%';
    $('#xpS').textContent = 'Nivel ' + p.level + (p.level < G.Data.progression.maxLevel ? '  ·  ' + U.fmt(p.xp) + ' / ' + U.fmt(need) + ' XP' : '');

    if (UI.holding) { const hEl = $('#held'); hEl.style.left = (G.Input.cx - hEl.offsetWidth / 2) + 'px'; hEl.style.top = (G.Input.cy - hEl.offsetHeight / 2) + 'px'; }
  };

  UI.drawOrb = function (cv, k, cols, t) {
    const c = cv.getContext('2d'), W = cv.width, R = W * 0.4, cx = W / 2, cy = W / 2;
    k = U.clamp(k || 0, 0, 1);
    c.clearRect(0, 0, W, W);
    // marco de tubería
    c.fillStyle = '#1a1511'; c.beginPath(); c.arc(cx, cy, R + 18, 0, 7); c.fill();
    const fr = c.createLinearGradient(0, 0, W, W); fr.addColorStop(0, '#8a8f96'); fr.addColorStop(0.5, '#3a3a3e'); fr.addColorStop(1, '#6a5a4a');
    c.strokeStyle = fr; c.lineWidth = 12; c.beginPath(); c.arc(cx, cy, R + 9, 0, 7); c.stroke();
    // marcas de manómetro
    c.strokeStyle = '#c8b090'; c.lineWidth = 2;
    for (let i = 0; i <= 10; i++) { const a = Math.PI * 0.75 + i / 10 * Math.PI * 1.5; c.beginPath(); c.moveTo(cx + Math.cos(a) * (R + 4), cy + Math.sin(a) * (R + 4)); c.lineTo(cx + Math.cos(a) * (R + 14), cy + Math.sin(a) * (R + 14)); c.stroke(); }
    [0.25, 0.75].forEach((a) => { const an = a * Math.PI * 2 - Math.PI / 2; c.fillStyle = '#5a5e64'; c.beginPath(); c.arc(cx + Math.cos(an) * (R + 9), cy + Math.sin(an) * (R + 9), 6, 0, 7); c.fill(); });
    // interior
    c.save(); c.beginPath(); c.arc(cx, cy, R, 0, 7); c.clip();
    c.fillStyle = '#0a0806'; c.fillRect(0, 0, W, W);
    const top = cy + R - k * R * 2;
    const g = c.createLinearGradient(0, top, 0, cy + R); g.addColorStop(0, cols[0]); g.addColorStop(1, cols[1]);
    c.fillStyle = g; c.beginPath(); c.moveTo(0, W);
    for (let x = 0; x <= W; x += 6) c.lineTo(x, top + Math.sin(x * 0.05 + t * 3) * 4 + Math.sin(x * 0.11 - t * 2) * 2);
    c.lineTo(W, W); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.35)';
    for (let i = 0; i < 6; i++) { const bx = cx + Math.sin(i * 12.3) * R * 0.7, by = cy + R - ((t * 30 + i * 47) % (R * 2)); if (by > top) { c.beginPath(); c.arc(bx, by, 2 + (i % 3), 0, 7); c.fill(); } }
    c.restore();
    // reflejo de cristal
    const gl = c.createRadialGradient(cx - R * 0.35, cy - R * 0.45, 2, cx - R * 0.2, cy - R * 0.3, R);
    gl.addColorStop(0, 'rgba(255,255,255,0.35)'); gl.addColorStop(0.35, 'rgba(255,255,255,0.05)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = gl; c.beginPath(); c.arc(cx, cy, R, 0, 7); c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.8)'; c.lineWidth = 3; c.beginPath(); c.arc(cx, cy, R, 0, 7); c.stroke();
  };
