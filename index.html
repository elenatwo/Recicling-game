  UI.slotFor = function (it) {
    const p = G.game.player;
    if (it.slot === 'ring') return !p.equip.ring1 ? 'ring1' : !p.equip.ring2 ? 'ring2' : 'ring1';
    return it.slot;
  };
  UI.canEquip = function (it, slot) {
    if (!it || it.kind !== 'equip') return { ok: false, why: 'No se puede equipar' };
    const want = it.slot === 'ring' ? ['ring1', 'ring2'] : [it.slot];
    if (!want.includes(slot)) return { ok: false, why: 'No va en esa ranura' };
    const p = G.game.player;
    if (!G.Stats.meetsReq(p, it)) return { ok: false, why: 'No cumples los requisitos' };
    if (slot === 'offhand' && p.equip.weapon && p.equip.weapon.hands === 2) return { ok: false, why: 'Tu arma necesita las dos manos' };
    return { ok: true };
  };
  // devuelve el objeto que estaba equipado (o null). false si no se pudo
  UI.equip = function (it, slot) {
    const c = UI.canEquip(it, slot);
    if (!c.ok) { UI.toast(c.why, '#ff5a4a'); G.Audio.play('error'); return false; }
    const p = G.game.player;
    if (it.hands === 2 && p.equip.offhand) {
      if (!p.inv.add(p.equip.offhand)) { UI.toast('No hay sitio para guardar el escudo', '#ff5a4a'); return false; }
      p.equip.offhand = null;
    }
    const prev = p.equip[slot];
    p.equip[slot] = it;
    p.recalc();
    G.Audio.play('clank', 0.6);
    return prev;
  };
  function findItem(src, uid) {
    const p = G.game.player; uid = +uid;
    if (src === 'inv') return p.inv.items.find((e) => e.item.uid === uid)?.item;
    if (src === 'stash') return p.stash.items.find((e) => e.item.uid === uid)?.item;
    if (src === 'shop') return UI.stock[UI.shopNpc?.def.id]?.items.find((e) => e.item.uid === uid)?.item;
    if (src === 'equip') return Object.values(p.equip).find((i) => i && i.uid === uid);
    return null;
  }
  function gridOf(id) { const p = G.game.player; return id === 'inv' ? p.inv : id === 'stash' ? p.stash : UI.stock[UI.shopNpc?.def.id]; }

  UI.pickUp = function (item, from) {
    UI.holding = true; UI.held = { item, from };
    const h = $('#held');
    h.src = G.Items.iconURL(item);
    h.style.width = `calc(var(--cell) * ${item.w})`; h.style.height = `calc(var(--cell) * ${item.h})`;
    h.classList.remove('hidden');
    $('#tooltip').classList.add('hidden');
    G.Audio.play('ui', 0.6);
    UI.dirty();
  };
  UI.clearHeld = function () { UI.holding = false; UI.held = null; $('#held').classList.add('hidden'); UI.dirty(); };
  UI.returnHeld = function () {
    if (!UI.holding) return;
    const p = G.game.player, it = UI.held.item;
    if (!p.inv.add(it)) G.game.dropItem(it, p.x, p.y);
    UI.clearHeld();
  };
  UI.dropHeldToWorld = function () {
    const p = G.game.player, it = UI.held.item;
    const gi = new G.GroundItem(it, p.x + U.rand(-0.4, 0.4), p.y + U.rand(-0.4, 0.4));
    G.game.objects.push(gi);
    UI.clearHeld();
  };
  UI.sell = function (it) {
    if (it.kind === 'quest') { UI.toast('No puedes vender eso', '#ff5a4a'); return false; }
    const v = G.Items.sellPrice(it);
    G.game.player.gold += v;
    G.Audio.play('gold'); UI.toast('Vendido por ' + v + ' chips', '#ffe14a', false);
    UI.dirty(); return true;
  };
  UI.buy = function (it) {
    const p = G.game.player, grid = gridOf('shop');
    const price = G.Items.buyPrice(it.infinite ? Object.assign({}, it, { qty: 1 }) : it);
    if (p.gold < price) { UI.toast('No tienes chips suficientes (' + price + ')', '#ff5a4a'); G.Audio.play('error'); return; }
    let item = it;
    if (it.infinite) item = it.kind === 'gem' ? G.Items.gem(it.gemType, it.quality) : G.Items.consumable(it.cid, 1);
    if (!(item.kind === 'potion' ? p.pickup(item) : p.inv.add(item))) { UI.toast('Inventario lleno', '#ff5a4a'); G.Audio.play('error'); return; }
    p.gold -= price;
    if (!it.infinite) grid.remove(it);
    G.Audio.play('gold');
    UI.dirty();
  };
  UI.insertGem = function (gem, target) {
    if (!target || target.kind !== 'equip' || !target.sockets || target.gems.length >= target.sockets) return false;
    target.gems.push(gem);
    G.game.player.recalc();
    G.Audio.play('loot_magic');
    UI.toast('Engarzado: ' + gem.name, '#5aa2ff');
    return true;
  };

  UI.gridClick = function (gid, fx, fy, ev) {
    const p = G.game.player, grid = gridOf(gid);
    if (!grid) return;
    const cx = Math.floor(fx), cy = Math.floor(fy);
    if (gid === 'shop') {
      if (UI.holding) { if (UI.sell(UI.held.item)) UI.clearHeld(); return; }
      const e = grid.at(cx, cy); if (e) UI.buy(e.item);
      return;
    }
    if (UI.holding) {
      const it = UI.held.item;
      const tx = U.clamp(Math.round(fx - it.w / 2), 0, grid.w - it.w), ty = U.clamp(Math.round(fy - it.h / 2), 0, grid.h - it.h);
      const over = grid.overlapping(it, tx, ty);
      // gema sobre objeto engarzable
      if (it.kind === 'gem') { const e = grid.at(cx, cy); if (e && e.item !== it && UI.insertGem(it, e.item)) { UI.clearHeld(); return; } }
      if (over.length === 0) { grid.place(it, tx, ty); UI.clearHeld(); return; }
      if (over.length === 1) {
        const o = over[0].item;
        if (it.stack && o.cid === it.cid && o.qty < o.stack) { const n = Math.min(it.qty, o.stack - o.qty); o.qty += n; it.qty -= n; if (it.qty <= 0) UI.clearHeld(); UI.dirty(); return; }
        grid.remove(o);
        if (grid.cellsFree(it, tx, ty)) { grid.place(it, tx, ty); UI.clearHeld(); UI.pickUp(o, { type: gid }); return; }
        grid.place(o, over[0].x, over[0].y);
      }
      G.Audio.play('error', 0.5);
      return;
    }
    const e = grid.at(cx, cy);
    if (!e) return;
    if (ev.ctrlKey && UI.open.shop && gid === 'inv') { if (UI.sell(e.item)) grid.remove(e.item); UI.dirty(); return; }
    if (ev.shiftKey && UI.open.stash) { UI.moveBetween(gid, e.item); return; }
    grid.remove(e.item);
    UI.pickUp(e.item, { type: gid, x: e.x, y: e.y });
  };
  UI.moveBetween = function (gid, it) {
    const p = G.game.player;
    const from = gid === 'inv' ? p.inv : p.stash, to = gid === 'inv' ? p.stash : p.inv;
    from.remove(it);
    if (!to.add(it)) { from.add(it); UI.toast('No hay espacio', '#ff5a4a'); }
    G.Audio.play('ui', 0.6); UI.dirty();
  };
  UI.gridRight = function (gid, fx, fy) {
    const p = G.game.player, grid = gridOf(gid);
    const e = grid && grid.at(Math.floor(fx), Math.floor(fy));
    if (!e || UI.holding) return;
    const it = e.item;
    if (gid === 'shop') { UI.buy(it); return; }
    if (gid === 'stash') { UI.moveBetween('stash', it); return; }
    if (UI.open.shop) { if (UI.sell(it)) grid.remove(it); UI.dirty(); return; }
    if (UI.open.stash) { UI.moveBetween('inv', it); return; }
    if (it.kind === 'potion' || it.kind === 'scroll') {
      if (it.kind === 'scroll') { UI.closeAll(true); }
      if (p.usePotion(it)) { it.qty--; if (it.qty <= 0) grid.remove(it); }
      UI.dirty(); return;
    }
    if (it.kind === 'equip') {
      const slot = UI.slotFor(it);
      grid.remove(it);
      const prev = UI.equip(it, slot);
      if (prev === false) { grid.place(it, e.x, e.y); return; }
      if (prev) { if (grid.cellsFree(prev, e.x, e.y)) grid.place(prev, e.x, e.y); else if (!grid.add(prev)) G.game.dropItem(prev, p.x, p.y); }
      UI.dirty();
    }
  };
  UI.equipClick = function (slot, right) {
    const p = G.game.player;
    if (right) {
      const it = p.equip[slot]; if (!it || UI.holding) return;
      if (p.inv.add(it)) { p.equip[slot] = null; p.recalc(); G.Audio.play('ui'); } else UI.toast('Inventario lleno', '#ff5a4a');
      UI.dirty(); return;
    }
    if (UI.holding) {
      const it = UI.held.item;
      if (it.kind === 'gem' && p.equip[slot]) { if (UI.insertGem(it, p.equip[slot])) UI.clearHeld(); return; }
      const prev = UI.equip(it, slot);
      if (prev === false) return;
      UI.clearHeld();
      if (prev) UI.pickUp(prev, { type: 'equip', slot });
      return;
    }
    const it = p.equip[slot];
    if (!it) return;
    p.equip[slot] = null; p.recalc();
    UI.pickUp(it, { type: 'equip', slot });
  };
  UI.beltClick = function (i, right) {
    const p = G.game.player, b = p.beltSlots[i];
    if (right) { p.useBelt(i); return; }
    if (UI.holding) {
      const it = UI.held.item;
      if (it.kind !== 'potion') { UI.toast('En el cinturón solo caben kits y baterías', '#ffb02a'); return; }
      if (b && b.cid === it.cid) { const n = Math.min(it.qty, b.stack - b.qty); b.qty += n; it.qty -= n; if (it.qty <= 0) UI.clearHeld(); UI.dirty(); return; }
      p.beltSlots[i] = it; UI.clearHeld();
      if (b) UI.pickUp(b, { type: 'belt' });
      return;
    }
    if (b) { p.beltSlots[i] = null; UI.pickUp(b, { type: 'belt' }); }
  };

  UI.itemTip = function (it, src) {

      if (it.block) h += `<div>Bloqueo: ${it.block}%</div>`;

      const r = it.req, at = p.attrTotals || p.attrs;

      if (r.dex) h += `<div class="${at.dex < r.dex ? 'red' : ''}">Requiere ${r.dex} de Destreza</div>`;
      const mods = Object.assign({}, it.mods);
      const lines = Object.keys(mods).map((k) => G.Stats.describe(k, mods[k]));
      if (lines.length) h += '<hr>' + lines.map((l) => `<div class="mod">${U.esc(l)}</div>`).join('');
      if (it.sockets) {
        h += `<div class="mod">Engarces: ${it.gems.length}/${it.sockets}</div>`;
        for (const gm of it.gems) { const gmm = G.Items.gemMods(gm, it); for (const k in gmm) h += `<div style="color:${gm.color}">◆ ${U.esc(G.Stats.describe(k, gmm[k]))}</div>`; }
      }

        h += set.bonuses.map((b) => `<div class="${have >= b.pieces ? 'setc' : 'setoff'}">(${b.pieces} piezas) ${U.esc(b.text)}</div>`).join('');

    }
    return h;

  // comparación real recalculando las estadísticas con el objeto equipado
  UI.compareHTML = function (it) {
    const p = G.game.player;
    if (!G.Stats.meetsReq(p, it)) return '';
    const slot = UI.slotFor(it);
    const cur = p.stats;
    const clone = Object.create(Object.getPrototypeOf(p));
    Object.assign(clone, p); clone.equip = Object.assign({}, p.equip); clone.equip[slot] = it;
    if (it.hands === 2) clone.equip.offhand = null;
    const ns = G.Stats.compute(clone);
    G.Stats.compute(p); // restaurar caché (compute escribe en p.stats del clon)
    p.stats = cur;
    const avg = (s) => (s.physMin + s.physMax) / 2 + (s.elec[0] + s.elec[1]) / 2 + (s.fire[0] + s.fire[1]) / 2 + (s.tox[0] + s.tox[1]) / 2 + (s.mag[0] + s.mag[1]) / 2;
    const rows = [
      ['Daño medio', avg(ns) * ns.attackSpeed - avg(cur) * cur.attackSpeed, 1, ' /s'],
      ['Armadura', ns.armor - cur.armor, 0], ['Vida', ns.maxLife - cur.maxLife, 0], ['Carga', ns.maxMana - cur.maxMana, 0],
      ['Precisión', ns.ar - cur.ar, 0], ['Bloqueo', ns.block - cur.block, 0, '%'],
      ['Res. eléctrica', ns.res.elec - cur.res.elec, 0, '%'], ['Res. tóxica', ns.res.tox - cur.res.tox, 0, '%'], ['Res. fuego', ns.res.fire - cur.res.fire, 0, '%'], ['Res. magnética', ns.res.mag - cur.res.mag, 0, '%'],
      ['Velocidad', (ns.moveSpeed - cur.moveSpeed) / G.Data.progression.derived.moveSpeed * 100, 0, '%'],
    ].filter((r) => Math.abs(r[1]) >= 0.5);
    const eq = p.equip[slot];
    let h = `<hr><div class="cmp"><div class="tb">${eq ? 'Comparado con ' + U.esc(eq.name) : 'Ranura vacía'}</div>`;
    if (!rows.length) h += '<div class="tb">Sin cambios relevantes</div>';
    h += rows.map(([n, v, dec, suf = '']) => `<div class="${v > 0 ? 'grn' : 'red'}">${v > 0 ? '+' : ''}${v.toFixed(dec)}${suf} ${n}</div>`).join('');
    return h + '</div>';
  };
  UI.skillTip = function (id) {
    const p = G.game.player;
    if (id === 'attack') { const s = p.stats; return `<div class="tn">Ataque básico</div><div>${s.ranged ? 'Dispara con tu arma' : 'Golpea con tu arma'}: ${s.physMin}-${s.physMax} de daño físico</div><div class="tb">Sin coste de carga</div>`; }
    const sk = G.Data.skills[id], base = p.skills[id] || 0, L = G.Skills.levelOf(p, id);
    const vals = (lvl) => { const o = {}; for (const k in sk.params) { const v = G.Stats.skillVal(sk, k, lvl); o[k] = fmtV(['count', 'max', 'jumps'].includes(k) ? Math.floor(v) : v); } return o; };
    const br = G.Data.skillBranches.find((b) => b.id === sk.branch);
    let h = `<div class="tn" style="color:${br.color}">${U.esc(sk.name)}</div><div class="tb">${br.name} · Requiere nivel ${sk.reqLevel}${sk.prereq.length ? ' · ' + sk.prereq.map((x) => G.Data.skills[x].name).join(', ') : ''}</div>`;
    h += `<div>Nivel actual: <b>${base}</b>${L > base ? ` (+${L - base})` : ''}</div>`;
    h += `<div style="margin-top:0.3rem">${U.esc(U.template(sk.desc, vals(Math.max(1, L))))}</div>`;
    h += `<div class="tb">Coste: ${G.Stats.skillCost(sk, Math.max(1, L))} de carga${sk.cooldown ? ' · Recarga: ' + sk.cooldown + ' s' : ''}</div>`;
    if (base < G.Data.maxSkillLevel && base > 0) h += `<hr><div class="tb">Siguiente nivel:</div><div class="mod">${U.esc(U.template(sk.desc, vals(L + 1)))}</div>`;
    return h;
  };

  UI.showTip = function (el) {
    const tip = $('#tooltip');
    const spec = el.dataset.tip; if (!spec || UI.holding) { tip.classList.add('hidden'); return; }
    const p = G.game.player; let h = '';
    const [kind, a, b] = spec.split(':');
    if (kind === 'item') { const it = findItem(a, b); if (it) h = UI.itemTip(it, a); }
    else if (kind === 'belt') { const it = p.beltSlots[+a]; if (it) h = UI.itemTip(it, 'belt'); }
    else if (kind === 'skill') h = UI.skillTip(a);
    else if (kind === 'orb') h = a === 'life' ? `<div class="tn" style="color:#ff6a3a">Vida</div><div>${Math.ceil(p.life)} / ${p.maxLife}</div>` : `<div class="tn" style="color:#5ff0ff">Carga</div><div>${Math.floor(p.mana)} / ${p.maxMana}</div><div class="tb">La gastan las habilidades.</div>`;
    else if (kind === 'xp') h = `<div class="tn">Experiencia</div><div>Nivel ${p.level}: ${U.fmt(p.xp)} / ${U.fmt(p.xpNeeded())}</div>`;
    if (!h) { tip.classList.add('hidden'); return; }
    tip.innerHTML = h; tip.classList.remove('hidden');
    UI.placeTip();
  };
  UI.placeTip = function () {
    const tip = $('#tooltip'); if (tip.classList.contains('hidden')) return;
    const r = tip.getBoundingClientRect();
    let x = G.Input.cx + 18, y = G.Input.cy + 14;
    if (x + r.width > innerWidth - 6) x = G.Input.cx - r.width - 14;
    if (y + r.height > innerHeight - 6) y = innerHeight - r.height - 6;
    tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, y) + 'px';
  };

  // ---------------------------------------------------------------
  // Eventos
  // ---------------------------------------------------------------
  UI.bindEvents = function () {
    const root = $('#ui');
    const gridPos = (gEl, e) => { const r = gEl.getBoundingClientRect(); const cell = r.width / (gEl.dataset.grid === 'inv' ? 10 : 10); return { fx: (e.clientX - r.left) / cell, fy: (e.clientY - r.top) / cell }; };
    root.addEventListener('mousedown', (e) => {
      if (e.target.closest('input,select')) return;
      const btn = e.button;
      const gEl = e.target.closest('.grid');
      if (gEl) { const { fx, fy } = gridPos(gEl, e); if (btn === 0) UI.gridClick(gEl.dataset.grid, fx, fy, e); else if (btn === 2) UI.gridRight(gEl.dataset.grid, fx, fy); UI.dirty(); e.preventDefault(); return; }
      const eq = e.target.closest('[data-slot]');
      if (eq) { UI.equipClick(eq.dataset.slot, btn === 2); UI.dirty(); return; }
      const bt = e.target.closest('[data-belt]');
      if (bt) { UI.beltClick(+bt.dataset.belt, btn === 2); UI.dirty(); return; }
      const node = e.target.closest('[data-skillnode]');
      if (node) {
        const id = node.dataset.skillnode, p = G.game.player;
        if (btn === 2) { if (p.skills[id]) { p.rightSkill = id; G.Audio.play('ui'); UI.toast('Botón derecho: ' + G.Data.skills[id].name, '#e8e4d8', true); } }
        else G.Skills.learn(p, id);
        UI.dirty(); return;
      }
    });
    root.addEventListener('click', (e) => {
      const t = e.target;
      if (t.closest('[data-close]')) { const w = t.closest('.win'); const n = w.id.slice(2); UI.toggle(n, false); return; }
      const ob = t.closest('[data-open]');
      if (ob) { const n = ob.dataset.open; if (n === 'map') G.Minimap.cycle(); else if (n === 'pause') UI.toggle('pause', true); else UI.toggle(n); return; }
      const at = t.closest('[data-attr]');
      if (at) { const p = G.game.player; if (p.attrPoints > 0) { const n = e.shiftKey ? Math.min(5, p.attrPoints) : 1; p.attrs[at.dataset.attr] += n; p.attrPoints -= n; p.recalc(); G.Audio.play('ui'); } return; }
      const pk = t.closest('[data-pick]');
      if (pk) { UI.openChooser(pk); return; }
      const hot = t.closest('[data-hot]');
      if (hot) { const id = G.game.player.hotkeys[hot.dataset.hot]; if (id) { G.game.player.rightSkill = id; UI.dirty(); } else UI.toggle('skills', true); return; }
      const ch = t.closest('[data-choose]');
      if (ch) { const p = G.game.player; p[UI.chooseSide === 'left' ? 'leftSkill' : 'rightSkill'] = ch.dataset.choose; $('#chooser').classList.add('hidden'); UI.dirty(); G.Audio.play('ui'); return; }
      const wp = t.closest('[data-wp]');
      if (wp && !wp.disabled) { UI.toggle('waypoints', false); G.game.travelWaypoint(wp.dataset.wp); return; }
      if (t.closest('[data-repair]')) { UI.repairAll(); return; }
      const act = t.closest('[data-act]');
      if (act) {
        const a = act.dataset.act;
        if (a === 'resume') UI.closeAll();
        if (a === 'options') { UI.setOpen('pause', false); UI.toggle('options', true); }
        if (a === 'help') { UI.setOpen('pause', false); UI.toggle('help', true); }
        if (a === 'pauseback') { UI.setOpen('options', false); UI.setOpen('help', false); UI.toggle('pause', true); }
        if (a === 'save') { G.game.save(); UI.toast('Partida guardada', '#9dff3a'); }
        if (a === 'menu') { G.game.save(); UI.closeAll(true); G.game.state = 'title'; UI.showHUD(false); G.Title.show(); }
        return;
      }
      const dl = t.closest('[data-dlg]');
      if (dl) UI.dialogAction(dl.dataset.dlg);
    });
    root.addEventListener('input', (e) => {
      const o = e.target.dataset.opt; if (o) G.Options.set(o, +e.target.value);
      const c = e.target.dataset.optc; if (c) G.Options.set(c, e.target.checked);
      const s = e.target.dataset.opts; if (s) G.Options.set(s, e.target.value);
    });
    // tooltip y fantasma de colocación
    document.addEventListener('mousemove', (e) => {
      const el = e.target.closest && e.target.closest('[data-tip]');
      if (el !== UI._tipEl) { UI._tipEl = el; if (el) UI.showTip(el); else $('#tooltip').classList.add('hidden'); }
      else UI.placeTip();
      const node = e.target.closest && e.target.closest('[data-skillnode],[data-choose]');
      UI.hoverSkill = node ? node.dataset.skillnode || node.dataset.choose : null;
      if (UI.hoverSkill === 'attack') UI.hoverSkill = null;
      document.querySelectorAll('.ghost').forEach((gh) => gh.classList.add('hidden'));
      const gEl = e.target.closest && e.target.closest('.grid');
      if (gEl && UI.holding && gEl.dataset.grid !== 'shop') {
        const it = UI.held.item, { fx, fy } = gridPos(gEl, e), grid = gridOf(gEl.dataset.grid);
        const tx = U.clamp(Math.round(fx - it.w / 2), 0, grid.w - it.w), ty = U.clamp(Math.round(fy - it.h / 2), 0, grid.h - it.h);
        const gh = gEl.querySelector('.ghost');
        gh.classList.remove('hidden'); gh.classList.toggle('no', grid.overlapping(it, tx, ty).length > 1);
        Object.assign(gh.style, { left: `calc(var(--cell)*${tx})`, top: `calc(var(--cell)*${ty})`, width: `calc(var(--cell)*${it.w})`, height: `calc(var(--cell)*${it.h})` });
      }
    });
    // re-render del tooltip cuando cambia la interfaz
    setInterval(() => { if (UI._tipEl && !document.body.contains(UI._tipEl)) { UI._tipEl = null; $('#tooltip').classList.add('hidden'); } }, 200);
  };

  UI.openChooser = function (el) {
    const p = G.game.player, side = el.dataset.pick;
    UI.chooseSide = side;
    const ch = $('#chooser');
    const ids = (side === 'left' ? ['attack'] : []).concat(Object.keys(p.skills).filter((id) => side === 'right' || G.Data.skills[id].leftable));
    ch.innerHTML = ids.map((id) => `<div class="slot" data-choose="${id}" data-tip="skill:${id}"><img src="${skillImg(id)}"></div>`).join('') || '<span style="font-size:0.8rem">Aprende habilidades con T</span>';
    ch.classList.remove('hidden');
    const r = el.getBoundingClientRect();
    ch.style.left = Math.max(4, r.left - 40) + 'px'; ch.style.top = (r.top - ch.offsetHeight - 8) + 'px';
  };

  UI.repairAll = function () {
    const p = G.game.player, cost = UI.repairCost();
    if (!cost) { UI.toast('Todo está en buen estado', '#e8e4d8'); return; }
    if (p.gold < cost) { UI.toast('Necesitas ' + cost + ' chips', '#ff5a4a'); G.Audio.play('error'); return; }
    p.gold -= cost;
    for (const it of Object.values(p.equip)) if (it && it.maxDur) it.dur = it.maxDur;
    for (const e of p.inv.items) if (e.item.maxDur) e.item.dur = e.item.maxDur;
    p.recalc(); G.Audio.play('repair'); UI.toast('Equipo reparado', '#9dff3a'); UI.dirty();
  };

  UI.dialogAction = function (a) {
    const npc = UI.dlgNpc;
    if (a === 'next') { UI.dlgPage++; UI.renderDialog(); return; }
    if (a === 'bye') { UI.closeDialog(); return; }
    if (a === 'trade') { UI.closeDialog(); UI.shopNpc = npc; if (!UI.stock[npc.def.id]) UI.refreshStock(); UI.toggle('shop', true); return; }
    if (a === 'repair') { UI.repairAll(); UI.renderDialog(); return; }
    if (a === 'lore') { UI.dlgPages = [{ text: U.pick(npc.def.lore) }]; UI.dlgPage = 0; UI.renderDialog(); return; }
    if (a === 'quest') {
      const pages = G.Quests.hasNews() ? G.Quests.talk() : [];
      if (!pages.length) { const cq = G.Quests.current(); pages.push({ text: cq ? G.game.quests[cq.id].status === 'active' ? cq.progress + ' (' + cq.summary + ')' : cq.summary : 'Has hecho más que suficiente. Descansa.', title: cq ? cq.name : '' }); }
      UI.dlgPages = pages; UI.dlgPage = 0; UI.renderDialog();
    }
  };

  G.UI = UI;
})();


/* ==== src/ui/minimap.js ==== */
/* =====================================================================
 * Minimapa isométrico (esquina) y mapa completo semitransparente.
 * Solo muestra lo explorado. M / Tab: esquina → completo → oculto.
 * ===================================================================== */
'use strict';
(function () {
  const U = G.U;
  const MM = { mode: 0, img: null, ver: -1, mapRef: null };

  MM.reset = function () { this.ver = -1; this.mapRef = null; };
  MM.cycle = function () {
    this.mode = (this.mode + 1) % 3;
    document.getElementById('minimap').classList.toggle('hidden', this.mode !== 0);
    document.getElementById('bigmap').classList.toggle('hidden', this.mode !== 1);
    G.Audio.play('ui', 0.5);
  };

  MM.rebuild = function (map) {
    if (!this.img || this.img.width !== map.w || this.img.height !== map.h) this.img = U.makeCanvas(map.w, map.h);
    const c = this.img.getContext('2d');
    const id = c.createImageData(map.w, map.h), d = id.data;
    const ts = G.Data.tilesets[map.tileset];
    const [ar, ag, ab] = U.hexToRgb(ts.accent);
    for (let i = 0; i < map.solid.length; i++) {
      if (!map.explored[i]) continue;
      const s = map.solid[i], o = i * 4;
      if (s === 0) { const sp = map.special[i]; if (sp === 5) { d[o] = ar * 0.4; d[o + 1] = ag * 0.4; d[o + 2] = ab * 0.4; } else { d[o] = 120; d[o + 1] = 108; d[o + 2] = 90; } d[o + 3] = 150; }
      else if (s === 1) { d[o] = 210; d[o + 1] = 150; d[o + 2] = 90; d[o + 3] = 230; }
    }
    c.putImageData(id, 0, 0);
    this.ver = map.version; this.mapRef = map;
  };

  function drawTo(cv, k, cx, cy, alpha, round) {
    const g = G.game, map = g.map, p = g.player;
    const c = cv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, cv.width, cv.height);
    if (round) { c.fillStyle = 'rgba(14,11,9,0.85)'; c.beginPath(); c.arc(cv.width / 2, cv.height / 2, cv.width / 2, 0, 7); c.fill(); c.save(); c.beginPath(); c.arc(cv.width / 2, cv.height / 2, cv.width / 2 - 2, 0, 7); c.clip(); }
    // tile (x,y) -> ((x-y)*k, (x+y)*k/2)
    const tx = cx - (p.x - p.y) * k, ty = cy - (p.x + p.y) * k / 2;
    c.globalAlpha = alpha;
    c.imageSmoothingEnabled = false;
    c.setTransform(k, k / 2, -k, k / 2, tx, ty);
    c.drawImage(MM.img, 0, 0);
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalAlpha = 1;
    const P = (x, y) => [tx + (x - y) * k, ty + (x + y) * k / 2];
    const dot = (x, y, col, r) => { if (!map.explored[map.idx(Math.floor(x), Math.floor(y))] && !round) return; const [sx, sy] = P(x, y); c.fillStyle = col; c.beginPath(); c.arc(sx, sy, r, 0, 7); c.fill(); };
    for (const o of g.objects) {
      if (o.isPortal) dot(o.x, o.y, o.kind === 'town' ? '#3fa8ff' : o.kind === 'boss' ? '#ff2bd6' : '#ffb02a', 5);
      else if (o.isWaypoint) dot(o.x, o.y, '#3fe0ff', 5);
      else if (o.isNPC) dot(o.x, o.y, '#ffe14a', 4);
      else if (o.isGroundItem && o.item && o.item.kind === 'quest') dot(o.x, o.y, '#ff9d2a', 5);
      else if (o.isChest && !o.opened && map.explored[map.idx(Math.floor(o.x), Math.floor(o.y))]) dot(o.x, o.y, o.sealed ? '#ff2bd6' : '#e6c229', 3);
    }
    for (const e of g.enemies) if (e.alive && !e.burrowed && U.dist(e.x, e.y, p.x, p.y) < 18) dot(e.x, e.y, e.boss ? '#ff2bd6' : e.rarity === 'normal' || e.rarity === 'mutant' ? '#e0473a' : '#ff9d2a', e.boss ? 6 : 2.5);
    const [px, py] = P(p.x, p.y);
    c.fillStyle = '#fff'; c.strokeStyle = '#000'; c.lineWidth = 2; c.beginPath(); c.arc(px, py, 5, 0, 7); c.fill(); c.stroke();
    if (round) c.restore();
  }

  MM.draw = function () {
    const g = G.game; if (!g.map || this.mode === 2) return;
    if (this.mapRef !== g.map || this.ver !== g.map.version) this.rebuild(g.map);
    if (this.mode === 0) {
      const cv = document.getElementById('minimap');
      drawTo(cv, 4.5, cv.width / 2, cv.height / 2, 1, true);
    } else {
      const cv = document.getElementById('bigmap');
      if (cv.width !== innerWidth || cv.height !== innerHeight) { cv.width = innerWidth; cv.height = innerHeight; }
      const k = Math.min(innerWidth, innerHeight * 2) / (g.map.w + g.map.h) * 1.15;
      drawTo(cv, k, innerWidth / 2, innerHeight / 2, 0.75, false);
    }
  };

  G.Minimap = MM;
})();


/* ==== src/ui/title.js ==== */
/* =====================================================================
 * Pantalla de título: horizonte de chatarra en capas, cielo de smog y
 * la silueta de EL COMPACTADOR al fondo.
 * ===================================================================== */
'use strict';
(function () {
  const U = G.U;
  const T = { t: 0, layers: null, ash: [] };

  T.show = function () {
    let el = document.getElementById('title');
    if (!el) { el = document.createElement('div'); el.id = 'title'; document.body.appendChild(el); }
    const has = G.Save.exists();
    const sv = has ? G.Save.read() : null;
    el.innerHTML = `
      <div class="logo">Scrapheap<span>Protocolo Vertedero</span></div>
      <p class="tag">Trescientos años de basura se han despertado con hambre. Eres un Reciclador: entra en el Sector Cero, limpia Las Fauces de Chatarra y apaga a EL COMPACTADOR.</p>
      <div class="menu">
        ${has ? `<button class="btn primary" id="tContinue">Continuar${sv && sv.player ? ' — nivel ' + sv.player.level : ''}</button>` : ''}
        <button class="btn ${has ? '' : 'primary'}" id="tNew">Nueva partida</button>
        <label><input type="checkbox" id="tDemo"> Modo demo: zonas más pequeñas y progreso rápido (30–45 min)</label>
      </div>
      <div class="legal">Juego original. Nombres, historia, arte y sonido generados para este proyecto.</div>`;
    el.classList.remove('hidden');
    const go = (fn) => { G.Audio.unlock(); el.classList.add('hidden'); fn(); };
    if (has) document.getElementById('tContinue').onclick = () => go(() => { if (!G.game.loadGame()) { G.game.newGame(false); } });
    document.getElementById('tNew').onclick = () => {
      if (has && !confirmNew()) return;
      go(() => G.game.newGame(document.getElementById('tDemo').checked));
    };
    G.Audio.playMusic('title');
    const once = () => { G.Audio.unlock(); document.removeEventListener('pointerdown', once); };
    document.addEventListener('pointerdown', once);
  };
  let confirmArm = false;
  function confirmNew() {
    if (confirmArm) return true;
    confirmArm = true;
    const b = document.getElementById('tNew'); b.textContent = 'Pulsa otra vez: se borrará la partida guardada';
    setTimeout(() => { confirmArm = false; if (b.isConnected) b.textContent = 'Nueva partida'; }, 3500);
    return false;
  }

  function buildLayers(W, H) {
    const rng = new U.RNG(777);
    const layers = [];
    const cols = ['#3a2a22', '#2a1e18', '#1a130f', '#0e0a08'];
    for (let l = 0; l < 4; l++) {
      const cv = U.makeCanvas(W * 2, H), c = cv.getContext('2d');
      const base = H * (0.55 + l * 0.11);
      c.fillStyle = cols[l];
      c.beginPath(); c.moveTo(0, H);
      for (let x = 0; x <= W * 2; x += 8) {
        const y = base - Math.abs(Math.sin(x * 0.004 * (l + 1) + l)) * (110 - l * 18) - rng.range(0, 14 - l * 2);
        c.lineTo(x, y);
      }
      c.lineTo(W * 2, H); c.fill();
      // siluetas de basura: neumáticos, antenas, carcasas
      for (let k = 0; k < 40; k++) {
        const x = rng.range(0, W * 2), y = base - rng.range(20, 90 - l * 15);
        const t = rng.int(0, 3);
        if (t === 0) { c.beginPath(); c.ellipse(x, y, 14 - l, 8 - l * 0.5, 0, 0, 7); c.fill(); }
        else if (t === 1) { c.fillRect(x, y - 30, 2, 40); c.fillRect(x - 6, y - 30, 14, 2); }
        else if (t === 2) { c.save(); c.translate(x, y); c.rotate(rng.range(-0.6, 0.6)); c.fillRect(-14, -10, 28, 20); c.restore(); }
        else { c.beginPath(); c.moveTo(x - 20, y + 10); c.lineTo(x, y - 18); c.lineTo(x + 24, y + 10); c.fill(); }
      }
      // luces de neón sucio
      if (l === 2) for (let k = 0; k < 14; k++) { c.fillStyle = rng.pick(['#ff9d2a', '#3fe0ff', '#ff4fd8', '#9dff3a']); c.fillRect(rng.range(0, W * 2), base - rng.range(10, 60), 3, 3); c.fillStyle = cols[l]; }
      layers.push({ cv, speed: 4 + l * 9 });
    }
    return layers;
  }

  T.render = function (ctx, dt) {
    this.t += dt;
    const S = G.Camera.scale, W = G.Camera.viewW, H = 720;
    ctx.setTransform(S, 0, 0, S, 0, 0);
    if (!this.layers || this.lw !== Math.round(W)) { this.layers = buildLayers(Math.round(W), H); this.lw = Math.round(W); }
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#1a1218'); sky.addColorStop(0.45, '#4a2a1e'); sky.addColorStop(0.7, '#8a4a20'); sky.addColorStop(1, '#2a1a12');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    // sol enfermo tras el smog
    const sg = ctx.createRadialGradient(W * 0.72, H * 0.5, 10, W * 0.72, H * 0.5, 220);
    sg.addColorStop(0, 'rgba(255,190,120,0.75)'); sg.addColorStop(0.2, 'rgba(255,140,60,0.35)'); sg.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
    // silueta del Compactador
    const cx = W * 0.72, by = H * 0.6;
    ctx.fillStyle = '#20151a';
    ctx.fillRect(cx - 120, by - 230, 240, 50); ctx.fillRect(cx - 90, by - 180, 20, 170); ctx.fillRect(cx + 70, by - 180, 20, 170);
    ctx.fillRect(cx - 140, by - 20, 280, 40);
    const py = by - 160 + (Math.sin(this.t * 0.8) * 0.5 + 0.5) * 80;
    ctx.fillRect(cx - 100, py, 200, 26);
    const pulse = 0.5 + Math.sin(this.t * 2) * 0.3;
    ctx.fillStyle = `rgba(255,43,214,${pulse})`; ctx.shadowColor = '#ff2bd6'; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.arc(cx, by - 205, 9, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    // capas
    for (const L of this.layers) {
      const off = (this.t * L.speed) % (W);
      ctx.drawImage(L.cv, -off, 0); ctx.drawImage(L.cv, W * 2 - off, 0);
    }
    // ceniza
    if (this.ash.length < 120) this.ash.push({ x: Math.random() * W, y: -10, v: U.rand(15, 40), s: U.rand(1, 2.5), w: Math.random() * 6 });
    ctx.fillStyle = 'rgba(220,200,180,0.5)';
    for (const a of this.ash) { a.y += a.v * dt; a.x += Math.sin(this.t + a.w) * 10 * dt - 8 * dt; ctx.fillRect(a.x, a.y, a.s, a.s); }
    this.ash = this.ash.filter((a) => a.y < H + 10);
    const vg = ctx.createLinearGradient(0, 0, W * 0.6, 0); vg.addColorStop(0, 'rgba(10,6,4,0.75)'); vg.addColorStop(1, 'rgba(10,6,4,0)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  };

  G.Title = T;
})();


/* ==== src/ui/endscreen.js ==== */
/* =====================================================================
 * Pantalla final: prados verdes, cielo azul, viento en la hierba,
 * flores, mariposas y pájaros. Texto exacto:
 *   "Has limpiado mi mundo, ahora salva el tuyo"
 * ===================================================================== */
'use strict';
(function () {
  const U = G.U;
  const END_TEXT = 'Has limpiado mi mundo, ahora salva el tuyo';
  const E = { t: 0, W: 0, H: 720 };

  E.start = function (stats) {
    this.t = 0; this.stats = stats; this.built = false;
    let el = document.getElementById('endUI');
    if (!el) { el = document.createElement('div'); el.id = 'endUI'; document.body.appendChild(el); }
    el.innerHTML = `<div class="msg">${END_TEXT}</div>
      <div class="fin"><div class="stats">
        <div><b>${U.timeStr(stats.time)}</b><small>Tiempo</small></div>
        <div><b>${U.fmt(stats.kills)}</b><small>Enemigos eliminados</small></div>
        <div><b>${stats.level}</b><small>Nivel alcanzado</small></div>
        <div><b>${U.fmt(stats.items)}</b><small>Objetos recogidos</small></div>
      </div>
      <button class="ebtn" id="eAgain">Jugar de nuevo</button><button class="ebtn" id="eMenu">Salir al menú</button></div>`;
    el.classList.remove('hidden');
    document.getElementById('eAgain').onclick = () => { el.classList.add('hidden'); G.Save.clear(); G.game.newGame(G.game.demo); };
    document.getElementById('eMenu').onclick = () => { el.classList.add('hidden'); G.game.state = 'title'; G.Title.show(); };
    G.Audio.playMusic('ending');
    G.UI.clearWhite(2.8);
    this.msgShown = false; this.finShown = false;
  };

  E.build = function () {
    const W = this.W, H = this.H, rng = new U.RNG(2026);
    this.clouds = Array.from({ length: 9 }, (_, i) => ({ x: rng.range(-200, W), y: rng.range(40, H * 0.32), s: rng.range(0.6, 1.4), v: rng.range(4, 12), puffs: Array.from({ length: rng.int(5, 8) }, () => ({ dx: rng.range(-70, 70), dy: rng.range(-18, 10), r: rng.range(22, 46) })) }));
    const hill = (amp, base, f1, f2, ph) => (x) => base - Math.sin(x * f1 + ph) * amp - Math.sin(x * f2 + ph * 2) * amp * 0.4;
    this.hills = [
      { f: hill(28, H * 0.56, 0.003, 0.009, 1), c1: '#8fcf9a', c2: '#6db58a' },
      { f: hill(36, H * 0.63, 0.0045, 0.011, 2.4), c1: '#6cc455', c2: '#4aa640' },
      { f: hill(30, H * 0.71, 0.006, 0.015, 4.1), c1: '#5cba3e', c2: '#3f9a2c' },
    ];
    this.trees = Array.from({ length: 10 }, () => { const l = rng.int(0, 1); const x = rng.range(0, W); return { x, l, y: this.hills[l].f(x), r: rng.range(10, 20) * (l + 1) * 0.8 }; });
    this.blades = [];
    for (let i = 0; i < 1600; i++) {
      const y = H * 0.74 + Math.pow(rng.next(), 0.7) * H * 0.28;
      const k = (y - H * 0.74) / (H * 0.28);
      this.blades.push({ x: rng.range(-10, W + 10), y, h: rng.range(14, 34) * (0.6 + k * 1.2), w: 1 + k * 2, c: rng.pick(['#3f9a2c', '#4fae34', '#62c240', '#79d24c', '#358a26']), p: rng.range(0, 6) });
    }
    this.blades.sort((a, b) => a.y - b.y);
    this.flowers = Array.from({ length: 220 }, () => {
      const y = H * 0.73 + Math.pow(rng.next(), 0.8) * H * 0.27, k = (y - H * 0.73) / (H * 0.27);
      return { x: rng.range(0, W), y, s: 1.5 + k * 4, c: rng.pick(['#ffffff', '#ffe14a', '#ff7eb6', '#b48cff', '#ff5a4a', '#ffffff', '#fff2a8']), p: rng.range(0, 6), stem: 6 + k * 16 };
    }).sort((a, b) => a.y - b.y);
    this.butterflies = Array.from({ length: 7 }, () => ({ x: rng.range(0, W), y: rng.range(H * 0.55, H * 0.85), p: rng.range(0, 6), c: rng.pick(['#ffb02a', '#ffffff', '#7ec8ff', '#ff7eb6']), sp: rng.range(20, 40) }));
    this.birds = Array.from({ length: 5 }, (_, i) => ({ x: -100 - i * 60, y: H * 0.18 + i * 14 + rng.range(-10, 10), v: rng.range(40, 60), p: rng.range(0, 6) }));
    this.pollen = Array.from({ length: 70 }, () => ({ x: rng.range(0, W), y: rng.range(0, H), v: rng.range(4, 14), p: rng.range(0, 6) }));
    this.built = true;
  };

  E.update = function (dt) {
    this.t += dt;
    const el = document.getElementById('endUI');
    if (!this.msgShown && this.t > 3) { this.msgShown = true; el.querySelector('.msg').classList.add('on'); }
    if (!this.finShown && this.t > 9) { this.finShown = true; el.querySelector('.fin').classList.add('on'); }
  };

  function drawRecycler(c, x, y, s, t) {
    c.save(); c.translate(x, y); c.scale(s, s);
    c.fillStyle = 'rgba(30,70,20,0.35)'; c.beginPath(); c.ellipse(0, 0, 14, 4, 0, 0, 7); c.fill();
    c.fillStyle = '#3a3330'; c.fillRect(-6, -20, 5, 20); c.fillRect(1, -20, 5, 20);
    c.fillStyle = '#8a5a2e'; c.fillRect(-13, -42, 5, 16); c.fillRect(8, -42, 5, 16);
    c.fillStyle = '#9a5522'; G.Sprites.rr(c, -9, -46, 18, 27, 4); c.fill();
    c.fillStyle = '#4a4e54'; G.Sprites.rr(c, -6, -48, 12, 22, 3); c.fill();
    c.fillStyle = '#9dff3a'; c.globalAlpha = 0.6 + Math.sin(t * 2) * 0.2; c.fillRect(-2, -45, 4, 15); c.globalAlpha = 1;
    c.fillStyle = '#7a7e86'; c.beginPath(); c.arc(0, -54, 9, 0, 7); c.fill();
    c.fillStyle = '#5a5e64'; c.fillRect(-9, -54, 18, 3);
    c.restore();
  }

  E.render = function (c) {
    const S = G.Camera.scale, W = G.Camera.viewW, H = 720, t = this.t;
    if (!this.built || Math.round(W) !== Math.round(this.W)) { this.W = W; this.build(); }
    c.setTransform(S, 0, 0, S, 0, 0);
    const sky = c.createLinearGradient(0, 0, 0, H * 0.75);
    sky.addColorStop(0, '#1569d4'); sky.addColorStop(0.5, '#4aa3f0'); sky.addColorStop(1, '#bfe6ff');
    c.fillStyle = sky; c.fillRect(0, 0, W, H);
    // sol y rayos
    const sx = W * 0.8, sy = H * 0.17;
    c.save(); c.translate(sx, sy); c.rotate(t * 0.03);
    c.fillStyle = 'rgba(255,250,210,0.10)';
    for (let i = 0; i < 12; i++) { c.rotate(Math.PI / 6); c.beginPath(); c.moveTo(0, 0); c.lineTo(-40, 520); c.lineTo(40, 520); c.fill(); }
    c.restore();
    const sg = c.createRadialGradient(sx, sy, 10, sx, sy, 200);
    sg.addColorStop(0, 'rgba(255,255,240,1)'); sg.addColorStop(0.18, 'rgba(255,248,200,0.9)'); sg.addColorStop(0.4, 'rgba(255,240,180,0.25)'); sg.addColorStop(1, 'rgba(255,240,180,0)');
    c.fillStyle = sg; c.beginPath(); c.arc(sx, sy, 200, 0, 7); c.fill();
    // nubes
    for (const cl of this.clouds) {
      cl.x += cl.v * (1 / 60) * 0.5; if (cl.x > W + 200) cl.x = -200;
      c.fillStyle = 'rgba(196,216,240,0.95)';
      for (const p of cl.puffs) { c.beginPath(); c.arc(cl.x + p.dx * cl.s, cl.y + p.dy * cl.s + 7 * cl.s, p.r * cl.s, 0, 7); c.fill(); }
      c.fillStyle = '#ffffff';
      for (const p of cl.puffs) { c.beginPath(); c.arc(cl.x + p.dx * cl.s, cl.y + p.dy * cl.s, p.r * cl.s, 0, 7); c.fill(); }
    }
    // pájaros
    c.strokeStyle = '#2a3a4a'; c.lineWidth = 2;
    for (const b of this.birds) {
      b.x += b.v / 60; if (b.x > W + 60) { b.x = -80; b.y = H * 0.12 + Math.random() * H * 0.2; }
      const f = Math.sin(t * 9 + b.p) * 5;
      c.beginPath(); c.moveTo(b.x - 9, b.y - f); c.quadraticCurveTo(b.x - 4, b.y - 3, b.x, b.y); c.quadraticCurveTo(b.x + 4, b.y - 3, b.x + 9, b.y - f); c.stroke();
    }
    // colinas y árboles
    this.hills.forEach((hl, i) => {
      const g = c.createLinearGradient(0, H * 0.5, 0, H);
      g.addColorStop(0, hl.c1); g.addColorStop(1, hl.c2);
      c.fillStyle = g; c.beginPath(); c.moveTo(0, H);
      for (let x = 0; x <= W; x += 10) c.lineTo(x, hl.f(x));
      c.lineTo(W, H); c.fill();
      for (const tr of this.trees) if (tr.l === i) {
        c.fillStyle = '#5a3a1e'; c.fillRect(tr.x - 2, tr.y - tr.r, 4, tr.r);
        c.fillStyle = i === 0 ? '#5aa860' : '#3d8f30'; c.beginPath(); c.arc(tr.x, tr.y - tr.r * 1.3, tr.r, 0, 7); c.fill();
        c.fillStyle = 'rgba(255,255,200,0.15)'; c.beginPath(); c.arc(tr.x - tr.r * 0.3, tr.y - tr.r * 1.5, tr.r * 0.5, 0, 7); c.fill();
      }
    });
    // el Reciclador, de espaldas, mirando el paisaje
    drawRecycler(c, W * 0.34, this.hills[2].f(W * 0.34) + 4, 1.25, t);
    // prado delantero
    const mg = c.createLinearGradient(0, H * 0.72, 0, H);
    mg.addColorStop(0, '#4fae34'); mg.addColorStop(1, '#2f7a1e');
    c.fillStyle = mg; c.fillRect(0, H * 0.74, W, H * 0.26);
    // hierba con ráfagas de viento que recorren el prado
    const gust = (x) => Math.sin(t * 1.4 - x * 0.006) * 0.6 + Math.sin(t * 2.3 - x * 0.013) * 0.3;
    let fi = 0;
    for (const b of this.blades) {
      while (fi < this.flowers.length && this.flowers[fi].y < b.y) drawFlower(c, this.flowers[fi++], t, gust);
      const sw = (gust(b.x) + Math.sin(t * 3 + b.p) * 0.15) * b.h * 0.45;
      c.strokeStyle = b.c; c.lineWidth = b.w;
      c.beginPath(); c.moveTo(b.x, b.y); c.quadraticCurveTo(b.x + sw * 0.3, b.y - b.h * 0.6, b.x + sw, b.y - b.h); c.stroke();
    }
    while (fi < this.flowers.length) drawFlower(c, this.flowers[fi++], t, gust);
    // mariposas
    for (const bf of this.butterflies) {
      bf.p += 1 / 60;
      bf.x += Math.cos(bf.p * 0.7) * bf.sp / 60; bf.y += Math.sin(bf.p * 1.3) * bf.sp / 90;
      if (bf.x < -20) bf.x = W + 10; if (bf.x > W + 20) bf.x = -10;
      const fl = Math.abs(Math.sin(t * 14 + bf.p * 3));
      c.fillStyle = bf.c;
      c.beginPath(); c.ellipse(bf.x - 4 * fl, bf.y, 5 * fl + 0.5, 4, -0.4, 0, 7); c.fill();
      c.beginPath(); c.ellipse(bf.x + 4 * fl, bf.y, 5 * fl + 0.5, 4, 0.4, 0, 7); c.fill();
      c.fillStyle = '#222'; c.fillRect(bf.x - 0.7, bf.y - 3, 1.4, 6);
    }
    // polen flotando
    c.fillStyle = 'rgba(255,255,220,0.7)';
    for (const p of this.pollen) { p.y -= p.v / 60; p.x += Math.sin(t + p.p) * 0.3; if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; } c.fillRect(p.x, p.y, 2, 2); }
    // suave viñeta luminosa para leer el texto
    const vg = c.createRadialGradient(W / 2, H * 0.48, 50, W / 2, H * 0.48, W * 0.6);
    vg.addColorStop(0, 'rgba(255,255,255,0.10)'); vg.addColorStop(1, 'rgba(0,30,60,0.10)');
    c.fillStyle = vg; c.fillRect(0, 0, W, H);
    c.setTransform(1, 0, 0, 1, 0, 0);
  };

  function drawFlower(c, f, t, gust) {
    const sw = gust(f.x) * f.stem * 0.4;
    const hx = f.x + sw, hy = f.y - f.stem;
    c.strokeStyle = '#3a8a28'; c.lineWidth = Math.max(1, f.s * 0.3);
    c.beginPath(); c.moveTo(f.x, f.y); c.quadraticCurveTo(f.x, f.y - f.stem * 0.5, hx, hy); c.stroke();
    c.fillStyle = f.c;
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2 + f.p; c.beginPath(); c.arc(hx + Math.cos(a) * f.s * 0.8, hy + Math.sin(a) * f.s * 0.6, f.s * 0.6, 0, 7); c.fill(); }
    c.fillStyle = '#ffcc33'; c.beginPath(); c.arc(hx, hy, f.s * 0.45, 0, 7); c.fill();
    void t;
  }

  E.TEXT = END_TEXT;
  G.End = E;
})();


/* ==== src/core/debug.js ==== */
/* =====================================================================
 * Atajos de depuración (desde la consola del navegador):
 *   SCRAP.god()            invulnerable + carga infinita (otra vez = off)
 *   SCRAP.level(15)        sube al nivel indicado
 *   SCRAP.goto('z5')       viaja a una zona (town, z1..z7)
 *   SCRAP.boss()           te lleva a la arena de EL COMPACTADOR
 *   SCRAP.killBoss()       derrota al jefe de la zona actual
 *   SCRAP.win()            muestra directamente la pantalla final
 *   SCRAP.item('unique')   genera un objeto (common|magic|rare|set|unique)
 *   SCRAP.gold(1000) · SCRAP.reveal() · SCRAP.spawn('robot','champion')
 * ===================================================================== */
'use strict';
(function () {
  const D = {};
  D.install = function () {
    const g = G.game;
    const need = () => { if (!g.player) { console.warn('Empieza una partida primero'); return false; } return true; };
    window.SCRAP = {
      god(on) {
        if (!need()) return;
        const p = g.player; p.invulnerable = on === undefined ? !p.invulnerable : on;
        if (p.invulnerable) { p._godT = setInterval(() => { p.mana = p.maxMana; p.life = p.maxLife; }, 200); }
        else clearInterval(p._godT);
        return 'Modo dios: ' + (p.invulnerable ? 'ON' : 'OFF');
      },
      level(n) { if (!need()) return; const p = g.player; while (p.level < Math.min(n, 20)) { p.xp = p.xpNeeded(); p.gainXP(0); } return 'Nivel ' + p.level; },
      goto(z, at = 'start') { if (!need()) return; if (g.state === 'ending') return; g.state = 'play'; g.enterZone(z, at); return 'Zona ' + z; },
      boss() { if (!need()) return; g.state = 'play'; g.enterZone('z7', 'pos', { x: 22, y: 29 }); return 'Arena del Compactador'; },
      killBoss() { if (!need()) return; const b = g.enemies.find((e) => e.boss && e.alive); if (b) { b.invulnerable = false; b.die(g.player); return b.name + ' derrotado'; } return 'No hay jefe vivo aquí'; },
      win() { if (!need()) return; g.triggerEnding(); return 'Pantalla final'; },
      item(rarity = 'rare', slot) { if (!need()) return; const it = G.Items.generate({ ilvl: g.player.level + 2, rarity, slot }); g.dropItem(it, g.player.x, g.player.y); return it.name; },
      gold(n = 1000) { if (!need()) return; g.player.gold += n; G.UI.dirty(); return g.player.gold; },
      reveal() { if (!need()) return; g.map.explored.fill(1); g.map.version++; return 'Mapa revelado'; },
      spawn(id = 'lata', rarity = 'normal') { if (!need()) return; const p = g.player; const e = g.spawnEnemy(id, p.x + 3, p.y + 3, g.zoneLevel, rarity, { affixes: rarity === 'champion' ? ['veloz'] : [] }); if (e) e.aggro = true; return e && e.name; },
      fps() { G.Options.set('showFps', !G.Options.get('showFps')); },
      get game() { return g; },
    };
    if (/[?&]debug/.test(location.search)) G.Options.v.showFps = true;
    console.log('%cSCRAPHEAP%c — atajos de depuración en window.SCRAP (god, level, goto, boss, killBoss, win, item, gold, reveal, spawn)', 'color:#ffb02a;font-weight:bold', 'color:inherit');
  };
  G.Debug = D;
})();


/* ==== src/core/game.js ==== */
/* =====================================================================
 * Núcleo del juego: bucle principal, estados (título, juego, muerte,
 * final), entrada del ratón, consultas espaciales y renderizado
 * isométrico con ordenación por profundidad e iluminación.
 * ===================================================================== */
'use strict';
(function () {
  const U = G.U, Iso = G.Iso, Cam = G.Camera, FX = G.FX;

  const game = {
    state: 'boot', time: 0, dt: 0, hitStop: 0, realTime: 0,
    player: null, map: null, zone: null, zoneLevel: 1, level: null,
    enemies: [], objects: [], allies: [], projectiles: [],
    zoneCache: {}, seeds: {}, flags: {}, waypoints: {}, quests: {},
    stats: null, demo: false, townPortal: null, firstTalk: true,
    hover: null, hoverKind: null, labels: [], grid: new Map(),
    fps: 60, _fpsT: 0, _fpsN: 0, saveT: 60, moveRepeat: 0,
  };
  Object.assign(game, G.World);
  G.game = game;

  // ---------------------------------------------------------------
  // Arranque
  // ---------------------------------------------------------------
  game.init = async function () {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    window.addEventListener('resize', () => this.resize());
    this.resize();
    G.Options.load();
    G.Input.init(this.canvas);
    await G.Data.load();
    G.UI.init();
    G.Input.onKey((e) => this.onKey(e));
    window.addEventListener('beforeunload', () => { if (this.state === 'play' || this.state === 'dead') this.save(); });
    document.getElementById('loading').remove();
    this.state = 'title';
    G.Title.show();
    let last = performance.now();
    const loop = (now) => {
      const real = Math.min(0.05, (now - last) / 1000); last = now;
      this.frame(real);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    G.Debug.install();
  };

  game.resize = function () {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = window.innerWidth, h = window.innerHeight;
    this.canvas.width = Math.round(w * dpr); this.canvas.height = Math.round(h * dpr);
    this.canvas.style.width = w + 'px'; this.canvas.style.height = h + 'px';
    // la vista lógica siempre tiene 720 px de alto (la anchura varía con el aspecto)
    Cam.scale = this.canvas.height / 720;
    Cam.viewH = 720; Cam.viewW = this.canvas.width / Cam.scale;
    document.documentElement.style.setProperty('--ui', Math.max(0.45, Math.min(1.5, h / 820, w / 1150)).toFixed(3));
  };

  // ---------------------------------------------------------------
  // Partidas
  // ---------------------------------------------------------------
  game.newGame = function (demo) {
    this.demo = !!demo;
    this.zoneCache = {}; this.seeds = {}; this.flags = {}; this.waypoints = { town: true };
    this.quests = G.Quests.initState();
    this.stats = { time: 0, kills: 0, items: 0, deaths: 0, xp: 0, secrets: 0, bosses: 0 };
    this.townPortal = null; this.firstTalk = true;
    const p = (this.player = new G.Player());
    // equipo inicial
    p.equip.weapon = G.Items.generate({ ilvl: 1, rarity: 'common', baseId: 'llave_oxidada' });
    p.equip.chest = G.Items.generate({ ilvl: 1, rarity: 'common', baseId: 'peto_bidon' });
    p.beltSlots = [G.Items.consumable('kit_s', 3), G.Items.consumable('kit_s', 3), G.Items.consumable('bat_s', 3), null];
    p.inv.add(G.Items.consumable('baliza', 2));
    p.recalc();
    this.enterZone('town', 'start');
    this.state = 'play';
    G.UI.showHUD(true);
    setTimeout(() => this.zone.id === 'town' && G.UI.banner(G.Data.act.name, 'Habla con el Viejo Operador "Cable" (!)', '#ff9d2a'), 4300);
    this.save();
  };

  game.save = function () {
    if (!this.player) return;
    const p = this.player;
    const data = {
      v: 1, demo: this.demo, player: p.serialize(), seeds: this.seeds, flags: this.flags, waypoints: this.waypoints, quests: this.quests,
      stats: this.stats, zone: this.zone ? this.zone.id : 'town', firstTalk: this.firstTalk, savedAt: Date.now(),
    };
    G.Save.write(data);
  };

  game.loadGame = function () {
    const d = G.Save.read();
    if (!d) return false;
    this.demo = !!d.demo; this.zoneCache = {}; this.seeds = d.seeds || {}; this.flags = d.flags || {};
    this.waypoints = d.waypoints || { town: true }; this.quests = Object.assign(G.Quests.initState(), d.quests);
    this.stats = Object.assign({ time: 0, kills: 0, items: 0, deaths: 0, xp: 0, secrets: 0, bosses: 0 }, d.stats);
    this.firstTalk = d.firstTalk !== undefined ? d.firstTalk : false;
    this.townPortal = null;
    const p = (this.player = new G.Player());
    p.load(d.player);
    p.recalc();
    let zid = d.zone || 'town';
    // reaparecer en la baliza de la zona guardada (o en el campamento)
    if (zid === 'z7') zid = 'z6';
    this.enterZone(zid, zid === 'town' ? 'start' : this.waypoints[zid] ? 'waypoint' : 'start');
    this.state = 'play';
    G.UI.showHUD(true);
    return true;
  };

  // ---------------------------------------------------------------
  // Zonas
  // ---------------------------------------------------------------
  game.enterZone = function (id, at = 'start', pos) {
    const z = this.loadZone(id);
    this.zone = z.zone; this.level = z.gen; this.map = z.map;
    this.enemies = z.enemies; this.objects = z.objects; this.projectiles = [];
    this.zoneLevel = Math.round((z.zone.level[0] + z.zone.level[1]) / 2);
    // los drones viajan contigo
    this.allies = this.allies.filter((a) => a.alive);
    FX.clear();
    // limpiar portales de retorno caducados
    this.objects = z.objects = z.objects.filter((o) => !o.temp);
    this.enemies = z.enemies = z.enemies.filter((e) => e.alive);
    const p = this.player;
    let sx = z.gen.start.x, sy = z.gen.start.y;
    if (at === 'exit' && z.gen.exit) { sx = z.gen.exit.x - 2; sy = z.gen.exit.y + 2; }
    if (at === 'waypoint' && z.gen.waypoint) { sx = z.gen.waypoint.x + 1.5; sy = z.gen.waypoint.y + 1.5; }
    if (at === 'pos' && pos) { sx = pos.x; sy = pos.y; }
    const n = this.map.nearestWalkable(sx, sy, 6) || { x: Math.floor(z.gen.start.x), y: Math.floor(z.gen.start.y) };
    if (!this.map.walkable(Math.floor(sx), Math.floor(sy))) { sx = n.x + 0.5; sy = n.y + 0.5; }
    p.x = sx; p.y = sy; p.order = null; p.path = null; p.action = null; p.whirl = null; p.kvx = p.kvy = 0;
    for (const a of this.allies) { a.x = p.x + U.rand(-1, 1); a.y = p.y + U.rand(-1, 1); }
    Cam.follow(p.x, p.y, true);
    // portal de retorno en el campamento
    if (id === 'town' && this.townPortal) {
      const tp = this.townPortal;
      const pr = new G.Portal(z.gen.waypoint.x - 2.5, z.gen.waypoint.y - 1, { zone: tp.zone, at: 'pos', x: tp.x, y: tp.y, consume: true }, 'Volver a: ' + G.Data.zoneById[tp.zone].name, 'town');
      pr.temp = true; this.objects.push(pr);
    }
    if (id === this.townPortal?.zone) {
      const tp = this.townPortal;
      const pr = new G.Portal(tp.x, tp.y, { zone: 'town', at: 'start' }, 'Portal al Refugio Soldador', 'town');
      pr.temp = true; this.objects.push(pr);
    }
    if (this.zone.waypoint) this.waypoints[id] = this.waypoints[id] || (at === 'waypoint');
    G.Hazards.init(this.zone, this.zoneLevel);
    G.Audio.playMusic(this.zone.music);
    if (this.zone.safe) { p.life = p.maxLife; p.mana = p.maxMana; }
    G.UI.zoneTitle(this.zone.name, this.zone.intro);
    G.Minimap.reset();
    this.map.reveal(p.x, p.y, 12);
    this.save();
  };

  game.travelPortal = function (portal) {
    const t = portal.target;
    G.Audio.play('portal');
    if (t.consume) this.townPortal = null;
    G.UI.fade(() => this.enterZone(t.zone, t.at, t.at === 'pos' ? { x: t.x, y: t.y } : null));
  };
  game.travelWaypoint = function (zid) {
    G.Audio.play('portal');
    G.UI.fade(() => this.enterZone(zid, zid === 'town' ? 'start' : 'waypoint'));
  };
  game.useTownBeacon = function () {
    if (this.zone.safe) { G.UI.toast('Ya estás en el Refugio', '#ffb02a'); return false; }
    if (this.zone.id === 'z7' && this.enemies.some((e) => e.boss && e.alive && e.aggro)) { G.UI.toast('La interferencia del núcleo bloquea la baliza', '#ff2bd6'); return false; }
    const p = this.player;
    this.townPortal = { zone: this.zone.id, x: p.x, y: p.y };
    G.FX.ring(p.x, p.y, 0.3, 2, '#3fa8ff', 0.6, 4);
    G.Audio.play('portal');
    G.UI.fade(() => this.enterZone('town', 'start'));
    return true;
  };

  // ---------------------------------------------------------------
  // Eventos de juego
  // ---------------------------------------------------------------
  game.onEnemyKilled = function (e, src) {
    const p = this.player;
    this.stats.kills++;
    // experiencia con penalización por diferencia de nivel
    let xp = e.xp * (this.demo ? G.Data.progression.demo.xpMult : 1);
    const diff = p.level - e.level;
    if (diff > 4) xp *= Math.max(0.1, 1 - (diff - 4) * 0.18);
    if (!e.summoned || e.boss) p.gainXP(xp); else p.gainXP(xp * 0.35);
    // botín
    const tbl = e.boss ? 'elite' : e.def.loot || 'trash';
    const rolls = G.Data.items.rollsByMonsterRarity[e.boss ? 'boss' : e.rarity];
    const bonus = G.Data.items.rarityBonusByMonster[e.boss ? 'boss' : e.rarity];
    if (!e.summoned || Math.random() < 0.3) this.dropLoot(e.x, e.y, tbl, e.level, rolls, bonus);
    if (e.boss) {
      this.flags['boss_' + e.def.id] = true;
      this.stats.bosses++;
      if (e.def.unique) this.dropItem(G.Items.makeUnique(e.def.unique), e.x, e.y);
      this.dropGold(G.Items.goldAmount(e.level, p.stats.goldFind) * 6, e.x, e.y);
      if (e.def.id !== 'compactador') { G.UI.banner(e.def.name + ' ha caído', '', '#ff9d2a'); G.Audio.play('quest'); }
    }
    G.Quests.onKill(e);
    if (e.def.id === 'compactador') this.startCollapse(e);
    void src;
  };

  game.onItemPicked = function (it) { G.Quests.onItem(it); };

  game.onPlayerDeath = function () {
    this.state = 'dead';
    this.stats.deaths++;
    setTimeout(() => G.UI.showDeath(), 1200);
  };
  game.respawn = function () {
    const p = this.player;
    const loss = Math.floor(p.gold * G.Data.progression.deathGoldLossPct);
    p.gold -= loss;
    p.alive = true; p.statuses = {}; p.buffs = {}; p.hot = [];
    p.recalc(); p.life = p.maxLife; p.mana = p.maxMana;
    this.state = 'play';
    // los jefes recuperan la vida
    for (const z of Object.values(this.zoneCache)) for (const e of z.enemies) if (e.alive && e.boss) { e.life = e.maxLife; e.aggro = false; if (G.Bosses[e.def.boss].init) { const ph = e.phase; G.Bosses[e.def.boss].init(e); if (ph) e.phase = 1; } }
    this.enterZone('town', 'start');
    if (loss) G.UI.toast('Has perdido ' + loss + ' chips', '#ff5a4a');
  };

  // desmoronamiento del Compactador -> secuencia final
  game.startCollapse = function (e) {
    this.collapse = { t: 0, x: e.x, y: e.y };
    G.Audio.play('roar', 1.3);
    G.Audio.stopMusic();
    for (const o of this.enemies) if (o !== e && o.alive) o.die(null);
    G.Quests.complete('q6');
  };
  game.updateCollapse = function (dt) {
    const c = this.collapse;
    c.t += dt;
    Cam.addShake(6 + c.t * 2);
    if (Math.random() < dt * 14) {
      const x = c.x + U.rand(-3, 3), y = c.y + U.rand(-2, 2);
      FX.debris(x, y, U.rand(20, 200), 8, ['#5c5f66', '#33353c', '#e6c229', '#ff2bd6', '#8a8e96']);
      FX.burst(x, y, U.rand(30, 150), 10, { type: 'flame', speed: 4, vz: 120, life: 0.6, color: ['#ff8a2a', '#ffe14a', '#ff2bd6'], glow: true, size: 5 });
      FX.smoke(x, y, 60, 3);
      G.Audio.play('explosion', 0.7);
    }
    if (c.t > 3.2 && !c.white) { c.white = true; G.UI.whiteFade(() => this.triggerEnding()); }
  };
  game.triggerEnding = function () {
    this.collapse = null;
    this.state = 'ending';
    this.flags.won = true;
    this.save();
    G.UI.showHUD(false);
    G.UI.closeAll();
    G.End.start({ time: this.stats.time, kills: this.stats.kills, level: this.player.level, items: this.stats.items, deaths: this.stats.deaths, secrets: this.stats.secrets });
  };

  // ---------------------------------------------------------------
  // Consultas espaciales
  // ---------------------------------------------------------------
  game.rebuildGrid = function () {
    this.grid.clear();
    for (const e of this.enemies) {
      if (!e.alive) continue;
      const k = ((e.x / 4) | 0) + ',' + ((e.y / 4) | 0);
      let b = this.grid.get(k); if (!b) { b = []; this.grid.set(k, b); } b.push(e);
    }
  };
  game.enemiesNear = function (x, y, r) {
    const out = [];
    const x0 = ((x - r) / 4) | 0, x1 = ((x + r) / 4) | 0, y0 = ((y - r) / 4) | 0, y1 = ((y + r) / 4) | 0;
    for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) { const b = this.grid.get(gx + ',' + gy); if (b) for (const e of b) out.push(e); }
    return out;
  };
  game.nearestEnemy = function (x, y, r, los) {
    let best = null, bd = r;
    for (const e of this.enemiesNear(x, y, r)) {
      if (!e.alive || e.burrowed) continue;
      const d = U.dist(x, y, e.x, e.y);
      if (d < bd && (!los || G.PF.los(this.map, x, y, e.x, e.y))) { bd = d; best = e; }
    }
    return best;
  };
  game.spawnProjectile = function (o) { const p = new G.Projectile(o); this.projectiles.push(p); return p; };

  // ---------------------------------------------------------------
  // Bucle
  // ---------------------------------------------------------------
  game.frame = function (real) {
    this.realTime += real;
    this._fpsT += real; this._fpsN++;
    if (this._fpsT >= 0.5) { this.fps = Math.round(this._fpsN / this._fpsT); this._fpsT = 0; this._fpsN = 0; }
    if (this.state === 'title') { G.Title.render(this.ctx, real); return; }
    if (this.state === 'ending') { G.End.update(real); G.End.render(this.ctx); return; }
    if (this.state !== 'play' && this.state !== 'dead') return;
    const paused = G.UI.paused;
    if (!paused) {
      if (this.hitStop > 0) this.hitStop -= real;
      else this.update(real);
    }
    this.render();
    G.UI.update(real);
    G.Input.endFrame();
  };

  game.update = function (dt) {
    this.dt = dt; this.time += dt;
    if (this.state === 'play') this.stats.time += dt;
    const p = this.player;
    this.rebuildGrid();
    if (this.state === 'play' && !this.collapse) this.handleInput(dt);
    p.update(dt);
    if (p.alive) this.map.reveal(p.x, p.y, 11);
    for (const e of this.enemies) {
      if (!e.alive) { e.update(dt); continue; }
      if (e.aggro || e.boss || Math.abs(e.x - p.x) + Math.abs(e.y - p.y) < 30) e.update(dt);
    }
    this.enemies = this.zoneCache[this.zone.id].enemies = this.enemies.filter((e) => e.alive || e.deathT < 0.5);
    for (const a of this.allies) a.update(dt);
    this.allies = this.allies.filter((a) => a.alive);
    for (const pr of this.projectiles) pr.update(dt);
    this.projectiles = this.projectiles.filter((pr) => !pr.dead);
    for (const o of this.objects) if (o.update) o.update(dt);
    if (this.objects.some((o) => o.dead)) this.objects = this.zoneCache[this.zone.id].objects = this.objects.filter((o) => !o.dead);
    G.Hazards.update(dt);
    FX.update(dt);
    if (this.collapse) this.updateCollapse(dt);
    Cam.follow(p.x, p.y);
    Cam.update(dt);
    this.saveT -= dt;
    if (this.saveT <= 0) { this.saveT = 60; this.save(); }
  };

  // ---------------------------------------------------------------
  // Entrada del ratón en el mundo
  // ---------------------------------------------------------------
  game.updateHover = function () {
    const I = G.Input;
    this.hover = null; this.hoverKind = null;
    if (I.overUI || G.UI.holding) return;
    const mx = I.mx, my = I.my;
    // etiquetas de objetos del suelo
    for (const l of this.labels) if (mx >= l.x && mx <= l.x + l.w && my >= l.y && my <= l.y + l.h) { this.hover = l.obj; this.hoverKind = 'object'; return; }
    // enemigos
    let best = null, bd = 1e9;
    for (const e of this.enemies) {
      if (!e.alive || e.burrowed) continue;
      const s = Cam.worldToScreen(e.x, e.y);
      const h = e.height * e.scale, w = Math.max(18, e.r * 50);
      if (mx > s.x - w && mx < s.x + w && my > s.y - h - 6 && my < s.y + 10) {
        const d = Math.abs(mx - s.x) + Math.abs(my - (s.y - h / 2)) * 0.5;
        if (d < bd) { bd = d; best = e; }
      }
    }
    if (best) { this.hover = best; this.hoverKind = 'enemy'; return; }
    for (const o of this.objects) {
      if (!o.label || !o.interact) continue;
      const s = Cam.worldToScreen(o.x, o.y);
      const hh = o.isNPC ? 60 : o.isPortal ? 55 : o.isWaypoint ? 50 : 22;
      if (Math.abs(mx - s.x) < (o.isNPC ? 18 : 26) && my > s.y - hh && my < s.y + 10) { this.hover = o; this.hoverKind = 'object'; return; }
    }
  };

  game.handleInput = function (dt) {
    const I = G.Input, p = this.player;
    this.updateHover();
    if (!p.alive) return;
    const w = Cam.screenToWorld(I.mx, I.my);
    if (G.UI.holding && I.leftPressed && !I.overUI) { G.UI.dropHeldToWorld(); return; }
    if (I.overUI) return;
    // clic izquierdo
    if (I.leftPressed) {
      this.moveRepeat = 0.15;
      if (this.hover && this.hoverKind === 'object') p.interact(this.hover);
      else if (this.hover && this.hoverKind === 'enemy') { p.attack(this.hover, p.leftSkill); this.heldTarget = this.hover; }
      else if (I.shift) { p.cast(p.leftSkill, w.x, w.y, null); this.heldTarget = null; }
      else { p.moveTo(w.x, w.y); this.heldTarget = null; G.UI.clickMarker(w.x, w.y); }
    } else if (I.left) {
      this.moveRepeat -= dt;
      if (this.heldTarget) {
        if (this.heldTarget.alive && !p.action && !p.order) p.attack(this.heldTarget, p.leftSkill);
        else if (!this.heldTarget.alive) this.heldTarget = null;
      } else if (I.shift) { if (!p.action) p.cast(p.leftSkill, w.x, w.y, null); }
      else if (this.moveRepeat <= 0 && (!p.order || p.order.type === 'move')) { this.moveRepeat = 0.12; p.moveTo(w.x, w.y); }
    }
    // clic derecho: habilidad seleccionada
    if (I.rightPressed || (I.right && !p.action && !p.order)) {
      const tgt = this.hoverKind === 'enemy' ? this.hover : null;
      if (p.rightSkill) {
        const sk = G.Data.skills[p.rightSkill];
        if (sk && (sk.type === 'melee') && !tgt) { if (I.rightPressed) G.UI.toast('Necesitas un objetivo', '#ffb02a', true); }
        else p.cast(p.rightSkill, tgt ? tgt.x : w.x, tgt ? tgt.y : w.y, tgt);
      }
    }
  };

  game.onKey = function (e) {
    if (this.state === 'ending' || this.state === 'title') return false;
    const p = this.player; if (!p) return false;
    const code = e.code;
    if (code === 'Escape') { G.UI.escape(); return true; }
    if (G.UI.paused) return false;
    if (G.UI.dialogOpen && code !== 'Space') return false;
    switch (code) {
      case 'KeyI': case 'KeyB': G.UI.toggle('inventory'); return true;
      case 'KeyC': case 'KeyA': G.UI.toggle('character'); return true;
      case 'KeyT': case 'KeyS': G.UI.toggle('skills'); return true;
      case 'KeyL': case 'KeyJ': G.UI.toggle('quests'); return true;
      case 'KeyM': case 'Tab': G.Minimap.cycle(); return true;
      case 'KeyH': case 'F1': G.UI.toggle('help'); return true;
      case 'Space': G.UI.closeAll(); return true;
      case 'Digit1': case 'Digit2': case 'Digit3': case 'Digit4': if (p.alive) p.useBelt(+code.slice(5) - 1); return true;
      case 'KeyQ': case 'KeyW': case 'KeyE': case 'KeyR': case 'KeyD': case 'KeyF': {
        const id = p.hotkeys[code];
        if (G.UI.hoverSkill) { p.hotkeys[code] = G.UI.hoverSkill; Object.keys(p.hotkeys).forEach((k) => { if (k !== code && p.hotkeys[k] === G.UI.hoverSkill) p.hotkeys[k] = null; }); G.UI.dirty(); return true; }
        if (id) { p.rightSkill = id; G.UI.dirty(); G.Audio.play('ui'); }
        return true;
      }
    }
    return false;
  };

  // ---------------------------------------------------------------
  // Renderizado
  // ---------------------------------------------------------------
  game.render = function () {
    const c = this.ctx, map = this.map, t = this.time;
    const S = Cam.scale;
    c.setTransform(S, 0, 0, S, 0, 0);
    c.imageSmoothingEnabled = true;
    const ts = G.Data.tilesets[map.tileset];
    c.fillStyle = U.shade(this.zone.fog || '#000000', -0.85);
    c.fillRect(0, 0, Cam.viewW, Cam.viewH);
    const ox = Cam.ox, oy = Cam.oy;
    // límites visibles
    const corners = [[0, 0], [Cam.viewW, 0], [0, Cam.viewH], [Cam.viewW, Cam.viewH]].map(([x, y]) => Cam.screenToWorld(x, y));
    const minX = Math.max(0, Math.floor(Math.min(...corners.map((q) => q.x))) - 2), maxX = Math.min(map.w - 1, Math.ceil(Math.max(...corners.map((q) => q.x))) + 3);
    const minY = Math.max(0, Math.floor(Math.min(...corners.map((q) => q.y))) - 2), maxY = Math.min(map.h - 1, Math.ceil(Math.max(...corners.map((q) => q.y))) + 3);
    const floors = G.Sprites.floors[map.tileset], walls = G.Sprites.walls[map.tileset], decals = G.Sprites.decals[map.tileset];
    const vis = (sx, sy, m = 80) => sx > -m && sx < Cam.viewW + m && sy > -m && sy < Cam.viewH + m * 2;
    const sortables = [];
    for (let y = minY; y <= maxY; y++) {
      for (let x = minX; x <= maxX; x++) {
        const i = y * map.w + x, s = map.solid[i];
        if (s === 2) continue;
        const sx = (x - y) * 32 + ox, sy = (x + y + 1) * 16 + oy;
        if (!vis(sx, sy)) continue;
        c.drawImage(floors[map.fvar[i]], sx - 32, sy - 16);
        if (s === 1) sortables.push({ wall: true, x, y, depth: x + y + 1, sx, sy, spr: walls[map.wvar[i]] });
        const sp = map.special[i];
        if (sp) this.drawSpecial(c, sp, sx, sy, t);
      }
    }
    // calcomanías
    for (const d of map.decals) {
      const sx = (d.x - d.y) * 32 + ox, sy = (d.x + d.y) * 16 + oy;
      if (!vis(sx, sy, 60)) continue;
      const cv = decals[d.v % decals.length].cv;
      c.drawImage(cv, sx - 40, sy - 20);
    }
    // marcador de clic
    G.UI.drawClickMarker(c);
    FX.drawGround(c, t);
    // objetos dinámicos
    const p = this.player;
    const push = (o, extra = 0) => { const sx = (o.x - o.y) * 32 + ox, sy = (o.x + o.y) * 16 + oy; if (vis(sx, sy, 200)) sortables.push({ o, depth: o.x + o.y + extra, sx, sy }); };
    for (const o of this.objects) push(o, o.isGroundItem ? -0.3 : o.isWaypoint ? -0.6 : 0);
    for (const e of this.enemies) push(e, e.boss && e.def.boss === 'compactor' ? -1.5 : 0);
    for (const a of this.allies) push(a, 0.2);
    for (const pr of this.projectiles) push(pr, 0.1);
    if (p.alive) push(p);
    sortables.sort((a, b) => a.depth - b.depth);
    const pd = p.x + p.y, ps = Cam.worldToScreen(p.x, p.y);
    for (const s of sortables) {
      if (s.wall) {
        const spr = s.spr;
        let fade = false;
        if (p.alive && s.depth > pd + 0.4 && Math.abs(s.sx - ps.x) < 70 && s.sy - spr.H - 16 < ps.y && s.sy > ps.y - 20) fade = true;
        // fade también para enemigos señalados
        if (fade) c.globalAlpha = 0.38;
        c.drawImage(spr.cv, s.sx - spr.ax, s.sy - spr.ay);
        if (fade) c.globalAlpha = 1;
      } else {
        const o = s.o;
        o.draw(c, s.sx, s.sy, t);
        if (o === this.hover && this.hoverKind === 'enemy') this.drawHoverRing(c, s.sx, s.sy, o);
      }
    }
    G.Hazards.drawTop(c);
    FX.drawTop(c, t);
    // luces
    FX.lights.length = 0;
    if (p.alive) FX.light(p.x, p.y, this.zone.safe ? 9 : 7, '#ffe8c0', 0.95);
    for (const o of this.objects) if (o.light) o.light();
    for (const pr of this.projectiles) if (pr.light) pr.light();
    for (const a of FX.areas) if (a.type === 'fire' || a.type === 'elec') FX.light(a.x, a.y, a.r * 2.2, a.type === 'fire' ? '#ff8a2a' : '#3fe0ff', 0.7);
    for (const e of this.enemies) if (e.boss && e.alive) FX.light(e.x, e.y, e.def.boss === 'compactor' ? 9 : 5, e.def.boss === 'compactor' ? '#ff2bd6' : '#ffb02a', 0.6);
    for (const a of this.allies) FX.light(a.x, a.y, 2, '#3fe0ff', 0.5);
    FX.Light.render(c, this.zone.darkness, this.zone.fog, t);
    // niebla de contaminación y viñeta
    this.drawFogAndVignette(c, t);
    // etiquetas
    this.drawLabels(c);
    if (this.hover && this.hoverKind === 'object' && this.hover.label && !this.hover.isGroundItem) {
      const s = Cam.worldToScreen(this.hover.x, this.hover.y);
      const h = this.hover.isNPC ? 74 : this.hover.isPortal ? 74 : this.hover.isWaypoint ? 70 : 36;
      this.drawTag(c, this.hover.label, s.x, s.y - h, this.hover.isNPC ? '#ffe14a' : '#e8e4d8');
    }
    if (G.Options.get('showFps')) { c.fillStyle = '#9dff3a'; c.font = '12px monospace'; c.textAlign = 'left'; c.fillText(this.fps + ' FPS · ' + this.enemies.length + ' enemigos · ' + FX.parts.length + ' partículas', 10, Cam.viewH - 120); }
    c.setTransform(1, 0, 0, 1, 0, 0);
  };

  game.drawSpecial = function (c, sp, sx, sy, t) {
    if (sp >= 1 && sp <= 4) {
      c.fillStyle = 'rgba(20,20,22,0.75)'; G.Sprites.diamondPath(c, sx, sy, 58, 29); c.fill();
      const d = [[1, 0], [-1, 0], [0, 1], [0, -1]][sp - 1];
      const vx = (d[0] - d[1]) * 32, vy = (d[0] + d[1]) * 16;
      const k = (t * 1.6) % 1;
      c.strokeStyle = 'rgba(230,194,41,0.7)'; c.lineWidth = 2;
      for (let j = -1; j <= 0; j++) {
        const f = (k + j * 0.5) % 1 - 0.25;
        const cx = sx + vx * f, cy = sy + vy * f;
        c.beginPath(); c.moveTo(cx - vy * 0.25 - vx * 0.12, cy + vx * 0.25 * 0.5 - vy * 0.12); c.lineTo(cx, cy); c.lineTo(cx + vy * 0.25 - vx * 0.12, cy - vx * 0.25 * 0.5 - vy * 0.12); c.stroke();
      }
    } else if (sp === 5) {
      const H = G.Hazards;
      c.fillStyle = H.panelsOn ? `rgba(63,224,255,${0.45 + Math.random() * 0.2})` : H.panelsWarn ? `rgba(63,224,255,${0.15 + 0.15 * Math.sin(t * 30)})` : 'rgba(40,60,70,0.5)';
      G.Sprites.diamondPath(c, sx, sy, 60, 30); c.fill();
      c.strokeStyle = 'rgba(63,224,255,0.5)'; c.lineWidth = 1; G.Sprites.diamondPath(c, sx, sy, 50, 25); c.stroke();
    }
  };

  game.drawHoverRing = function (c, sx, sy, e) {
    const r = e.r * 50 * e.scale;
    c.strokeStyle = e.rarity === 'unique' || e.boss ? '#ff9d2a' : e.rarity === 'champion' ? '#5aa2ff' : '#ff5a4a';
    c.lineWidth = 2; c.beginPath(); c.ellipse(sx, sy, r, r * 0.5, 0, 0, 7); c.stroke();
  };

  game.drawFogAndVignette = function (c, t) {
    const W = Cam.viewW, H = Cam.viewH;
    const fog = this.zone.fog;
    if (!this.zone.safe) {
      c.globalAlpha = 0.08;
      for (let i = 0; i < 3; i++) {
        const x = ((t * (8 + i * 5) + i * 400) % (W + 600)) - 300, y = H * (0.25 + i * 0.25);
        const g = c.createRadialGradient(x, y, 10, x, y, 320);
        g.addColorStop(0, fog); g.addColorStop(1, U.alpha(fog, 0));
        c.fillStyle = g; c.fillRect(x - 320, y - 320, 640, 640);
      }
      c.globalAlpha = 1;
    }
    const g = c.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    // pulso rojo con poca vida
    const p = this.player;
    if (p.alive && p.life / p.maxLife < 0.3) {
      const a = (0.3 - p.life / p.maxLife) * (0.8 + Math.sin(t * 6) * 0.2);
      const g2 = c.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H);
      g2.addColorStop(0, 'rgba(120,0,0,0)'); g2.addColorStop(1, `rgba(160,0,0,${a})`);
      c.fillStyle = g2; c.fillRect(0, 0, W, H);
    }
  };

  game.drawTag = function (c, text, x, y, color) {
    c.font = '13px "Chakra Petch", sans-serif';
    const w = c.measureText(text).width + 12;
    c.fillStyle = 'rgba(10,8,6,0.82)'; c.fillRect(x - w / 2, y - 10, w, 19);
    c.strokeStyle = 'rgba(255,255,255,0.12)'; c.strokeRect(x - w / 2 + 0.5, y - 9.5, w - 1, 18);
    c.fillStyle = color; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, x, y);
    return w;
  };

  game.drawLabels = function (c) {
    this.labels.length = 0;
    const order = ['common', 'magic', 'rare', 'set', 'unique'];
    const minR = order.indexOf(G.Options.get('labelFilter'));
    const showAll = G.Input.alt;
    const placed = [];
    c.font = '13px "Chakra Petch", sans-serif';
    for (const o of this.objects) {
      if (!o.isGroundItem || o.dead) continue;
      const it = o.item;
      const ri = it ? Math.max(order.indexOf(it.rarity), it.kind === 'quest' ? 4 : 0) : 0;
      const isHover = this.hover === o;
      if (!showAll && !isHover && it && it.kind === 'equip' && ri < minR) continue;
      if (!showAll && !isHover && it && it.kind !== 'equip' && it.kind !== 'quest' && minR > 1) continue;
      const s = Cam.worldToScreen(o.x, o.y);
      if (s.x < -100 || s.x > Cam.viewW + 100 || s.y < -50 || s.y > Cam.viewH + 50) continue;
      const w = c.measureText(o.label).width + 12, h = 18;
      let lx = s.x - w / 2, ly = s.y - 30 - o.z;
      for (let k = 0; k < 8; k++) {
        const hit = placed.find((r) => lx < r.x + r.w && lx + w > r.x && ly < r.y + r.h && ly + h > r.y);
        if (!hit) break; ly = hit.y - h - 2;
      }
      const r = { x: lx, y: ly, w, h, obj: o };
      placed.push(r); this.labels.push(r);
      c.fillStyle = isHover ? 'rgba(60,50,30,0.95)' : 'rgba(10,8,6,0.8)'; c.fillRect(lx, ly, w, h);
      if (isHover) { c.strokeStyle = o.color; c.strokeRect(lx + 0.5, ly + 0.5, w - 1, h - 1); }
      c.fillStyle = o.color; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(o.label, lx + w / 2, ly + h / 2 + 1);
    }
  };

  window.addEventListener('DOMContentLoaded', () => game.init().catch((err) => {
    console.error(err);
    const l = document.getElementById('loading');
    if (l) l.innerHTML = '<p style="color:#ff5a4a">Error al cargar: ' + U.esc(err.message) + '<br><small>Abre JUGAR.html (o dist/scrapheap.html), o ejecuta node build.js y vuelve a abrir index.html.</small></p>';
  }));
})();

</script>
</body>
</html>
