<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Yermo Limpio: juego educativo 2D pixel art sobre reciclaje, ecología y ahorro en un mundo post-apocalíptico.">
  <title>Yermo Limpio</title>

  <link rel="stylesheet" href="css/styles.css">
  <script src="js/game.js" defer></script>
</head>

<body>
  <main class="game">

    <!-- Pantalla del juego: canvas pixelado + capa de texto nítida -->
    <div class="game__screen">
      <canvas id="c" class="game__canvas" width="256" height="176"
              aria-label="Pantalla del juego Yermo Limpio"></canvas>
      <canvas id="o" class="game__text-layer" aria-hidden="true"></canvas>
    </div>

    <p class="game__help">
      Flechas/WASD mover · Espacio aspirar · K agua · E actuar · R retirar · Q misiones
    </p>

    <!-- Controles táctiles (solo visibles en pantallas táctiles) -->
    <div class="touch-controls" aria-label="Controles táctiles">
      <div class="touch-controls__dpad">
        <button type="button" class="touch-button touch-button--up"    data-k="arrowup"    aria-label="Arriba">▲</button>
        <button type="button" class="touch-button touch-button--left"  data-k="arrowleft"  aria-label="Izquierda">◀</button>
        <button type="button" class="touch-button touch-button--right" data-k="arrowright" aria-label="Derecha">▶</button>
        <button type="button" class="touch-button touch-button--down"  data-k="arrowdown"  aria-label="Abajo">▼</button>
      </div>

      <div class="touch-controls__actions">
        <button type="button" class="touch-button" data-k=" ">Aspirar</button>
        <button type="button" class="touch-button" data-k="k">Agua</button>
        <button type="button" class="touch-button" data-k="e">E</button>
        <button type="button" class="touch-button" data-k="r">R</button>
        <button type="button" class="touch-button" data-k="q">Misión</button>
      </div>
    </div>

    <noscript>Este juego necesita JavaScript activado para funcionar.</noscript>
  </main>
</body>

</html>
